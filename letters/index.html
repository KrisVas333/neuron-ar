<title>Floating Letters</title>
<link rel="icon" href="data:,">
<style>
  :root { --ink: #0f2a3a; --chip: rgba(255,255,255,.62); --chip-line: rgba(15,42,58,.18); }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9fd3e3; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; outline: none; cursor: grab; }
  canvas.drag { cursor: grabbing; }
  #grain { position: fixed; inset: -50%; pointer-events: none; opacity: .07; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    animation: grain 0.9s steps(6) infinite; }
  @keyframes grain { 0%{transform:translate(0,0)} 20%{transform:translate(-3%,2%)} 40%{transform:translate(2%,-4%)} 60%{transform:translate(-4%,-1%)} 80%{transform:translate(3%,3%)} 100%{transform:translate(0,0)} }
  #vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 55%, rgba(8,40,60,.28) 100%); }
  #dot { position: fixed; left: 50%; top: 50%; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%;
    background: #fff; box-shadow: 0 0 0 1.5px rgba(15,42,58,.45), 0 1px 4px rgba(0,0,0,.25); pointer-events: none; transition: transform .15s, background .15s; }
  #dot.on { transform: scale(1.9); background: #ffe36b; }
  #dot.no { animation: no .3s; }
  @keyframes no { 25%{margin-left:-9px} 75%{margin-left:1px} }
  #hint { position: fixed; left: 16px; bottom: 16px; display: flex; gap: 10px; flex-wrap: wrap; pointer-events: none;
    font: 600 13px/1 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); }
  .grp { display: flex; align-items: center; gap: 4px; padding: 6px 8px; border-radius: 12px; background: var(--chip);
    box-shadow: inset 0 0 0 1px var(--chip-line); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  kbd { display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 5px; box-sizing: border-box; border-radius: 6px;
    background: #fff; box-shadow: 0 2px 0 rgba(15,42,58,.25), inset 0 0 0 1px rgba(15,42,58,.15); font: 700 12px/1 system-ui, sans-serif; color: var(--ink); }
  .grp svg { width: 18px; height: 18px; flex: none; }
  /* HUD: letters left + the words you built (newest first) + finish early */
  #hud { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); width: min(760px, calc(100vw - 32px)); display: flex; align-items: flex-start; gap: 8px; pointer-events: none;
    font: 600 14px/1 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); }
  #left { flex: none; display: flex; align-items: center; gap: 7px; height: 38px; padding: 0 12px 0 6px; border-radius: 12px; background: var(--chip);
    box-shadow: inset 0 0 0 1.5px var(--chip-line); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  #left i { width: 26px; height: 28px; display: grid; place-items: center; border-radius: 7px; background: #fff; box-shadow: inset 0 0 0 1.5px #111;
    font: 400 20px/1 "Times New Roman", Tinos, serif; font-style: normal; color: #111; }
  #left b { font: 700 20px/1 system-ui, sans-serif; min-width: 24px; text-align: right; font-variant-numeric: tabular-nums; }
  #left.bump b { animation: bump .45s; }
  @keyframes bump { 40% { transform: scale(1.35); } }
  #words { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; gap: 6px; max-height: 82px; overflow: hidden; }
  #words span { height: 38px; display: inline-flex; align-items: center; padding: 0 11px; border-radius: 10px; background: #fff; box-shadow: inset 0 0 0 1.5px #111;
    font: 400 26px/1 "Times New Roman", Tinos, serif; color: #111; white-space: nowrap; }
  #words span.new { animation: chip .6s cubic-bezier(.3,1.6,.5,1) both; background: #ffe36b; }
  @keyframes chip { from { transform: scale(.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  #done { flex: none; pointer-events: auto; height: 38px; padding: 0 13px; border-radius: 12px; border: 0; background: #111; color: #fff; cursor: pointer;
    font: 700 14px/1 system-ui, -apple-system, "Segoe UI", sans-serif; }
  #hud.end #done { visibility: hidden; }
  #win .sum { margin: 0 0 14px; text-align: center; font: 400 clamp(54px, 10vw, 110px)/1 "Times New Roman", Tinos, serif; color: #111; animation: pop .7s cubic-bezier(.3,1.6,.5,1) both paused; }
  #win.show .sum { animation-play-state: running; }
  #win .sum small { display: block; margin-top: 6px; font: 700 18px/1.2 system-ui, sans-serif; color: var(--ink); }
  #win { text-align: center; }
  #win { position: fixed; left: 50%; top: 128px; transform: translateX(-50%); pointer-events: none; opacity: 0; transition: opacity .4s; }
  #win.show { opacity: 1; pointer-events: auto; }
  #win h1 { margin: 0; font: 400 clamp(80px, 16vw, 170px)/1 "Times New Roman", Tinos, serif; color: #111; letter-spacing: .08em; animation: pop .7s cubic-bezier(.3,1.6,.5,1) both paused; }
  #win.show h1 { animation-play-state: running; }
  @keyframes pop { from { transform: scale(.3); } to { transform: scale(1); } }
  #win button { font: 700 22px/1 system-ui, sans-serif; padding: 12px 22px; border-radius: 12px; border: 0; background: #111; color: #fff; cursor: pointer; }
  #vrbtn { position: fixed; right: 16px; bottom: 16px; display: none; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 12px; border: 0;
    background: #111; color: #fff; font: 700 15px/1 system-ui, -apple-system, "Segoe UI", sans-serif; cursor: pointer; box-shadow: 0 2px 10px rgba(0,0,0,.25); }
  #vrbtn.ok { display: flex; }
  #vrbtn svg { width: 22px; height: 22px; }

    fragmentShader: 'varying vec3 vP; void main(){ float h = vP.y*.5+.5; vec3 c = mix(vec3(.015,.04,.06), vec3(.10,.18,.22), smoothstep(.1,.9,h)); gl_FragColor = vec4(c,1.); }'

    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(color).multiplyScalar(intensity), side: THREE.DoubleSide }));
    m.position.copy(pos); m.lookAt(0, 0, 0); env.add(m);
  };

  box(3.5, 5, 9.0, new THREE.Vector3(-7, 2, 4), 0xfff4e6);     // warm key, front-left
  box(1.2, 7, 8.0, new THREE.Vector3(7, 1, -2), 0xe6f6ff);     // rim strip, right

  vertexShader: `varying vec3 vD; void main(){ vD = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader: `
    uniform float uT; varying vec3 vD;
    vec3 lin(vec3 c){ return pow(c, vec3(2.2)); }
    void main(){
      float h = vD.y*.5+.5;
      vec3 deep = lin(vec3(.13,.36,.50)), mid = lin(vec3(.47,.76,.86)), top = lin(vec3(.88,.97,1.0));
      vec3 col = mix(deep, mid, smoothstep(.0,.55,h));
      col = mix(col, top, smoothstep(.55,1.,h));
      // faint caustic shimmer, strongest overhead
      vec3 p = vD*7.;
      float a = sin(p.x*1.9 + uT*.55 + sin(p.z*1.4 + uT*.35)*1.6);
      float b = sin(p.z*2.2 - uT*.45 + sin(p.x*1.7 - uT*.30)*1.6);
      float c = pow(abs(a*b), 5.);
      col += lin(vec3(1.)) * c * .10 * smoothstep(.35,1.,h);

      col += lin(vec3(.85,.97,1.)) * .06 * pow(1.-abs(vD.y), 6.);

const bubbleUniforms = { uT: { value: 0 }, uScale: { value: 1 } };

  const pos = new Float32Array(n * 3), size = new Float32Array(n), speed = new Float32Array(n), phase = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const r = 3 + Math.pow(Math.random(), .7) * 24;
    const th = Math.random() * Math.PI * 2, ph = Math.acos(2 * Math.random() - 1);
    pos[i*3] = r * Math.sin(ph) * Math.cos(th); pos[i*3+1] = r * Math.cos(ph); pos[i*3+2] = r * Math.sin(ph) * Math.sin(th);
    const big = Math.random() < .35;
    size[i] = big ? .10 + Math.random() * .22 : .025 + Math.random() * .04;
    speed[i] = big ? .18 + Math.random() * .25 : .05 + Math.random() * .1;
    phase[i] = Math.random() * 100;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('aSize', new THREE.BufferAttribute(size, 1));

  g.setAttribute('aPhase', new THREE.BufferAttribute(phase, 1));
  const m = new THREE.ShaderMaterial({
    uniforms: bubbleUniforms, transparent: true, depthWrite: false,
    vertexShader: `
      attribute float aSize, aSpeed, aPhase; uniform float uT, uScale; varying float vA; varying float vS;
      void main(){
        vec3 p = position;
        p.y = mod(p.y + uT*aSpeed + 28., 56.) - 28.;
        p.x += sin(uT*.31 + aPhase)*.35; p.z += cos(uT*.27 + aPhase*1.3)*.35;
        vec4 mv = modelViewMatrix*vec4(p,1.);
        gl_PointSize = clamp(aSize*uScale / -mv.z, 1., 64.);

        float fill = .10*(1.-r);
        float hl = smoothstep(.32,.0,length(c-vec2(-.35,-.38)));
        float speck = 1.-smoothstep(.2,1.,r);
        float isBubble = step(.08, vS);

        gl_FragColor = vec4(vec3(1.), a);

const font = new FontLoader().parse(FONT_JSON);
const LETTER_SIZE = 1.6;
function makeLetterGeometry(ch) {
  let g = new TextGeometry(ch, {
    font, size: LETTER_SIZE, height: 0.37, curveSegments: 10, // half the old total thickness (0.5 + 2×0.12 bevel)
    bevelEnabled: false                                         // hard edges, no rounding
  });

  const c = new THREE.Vector3(); g.boundingBox.getCenter(c);
  g.translate(-c.x, -c.y, -c.z);              // tumble around its own middle
  g = toCreasedNormals(g, THREE.MathUtils.degToRad(35)); // smooth curves, hard corners
  // keep the flat front/back faces perfectly flat (no smoothing streaks bleeding in from the bevel)
  const P = g.attributes.position, N = g.attributes.normal;
  let zHi = -Infinity, zLo = Infinity;
  for (let i = 0; i < P.count; i++) { const z = P.getZ(i); if (z > zHi) zHi = z; if (z < zLo) zLo = z; }
  for (let i = 0; i < P.count; i += 3) {
    for (const [zz, nz] of [[zHi, 1], [zLo, -1]]) {
      if (Math.abs(P.getZ(i) - zz) < 1e-4 && Math.abs(P.getZ(i + 1) - zz) < 1e-4 && Math.abs(P.getZ(i + 2) - zz) < 1e-4)
        for (let k = 0; k < 3; k++) N.setXYZ(i + k, 0, 0, nz);
    }
  }
  N.needsUpdate = true;
  g.computeBoundingSphere(); g.computeBoundingBox();

  return g;
}

}

// ---------- physics (no library; one body per letter) ----------
const WORLD = { rMin: 3.2, rMax: 10.0, wall: 0.9, drag: 0.4, angDrag: 0.3, gap: 1.15 };
const letters = [];
const tmpV = new THREE.Vector3(), tmpV2 = new THREE.Vector3(), tmpQ = new THREE.Quaternion();

function addLetter(ch, position, opts = {}) {
  const mesh = new THREE.Mesh(makeLetterGeometry(ch), makeLetterMaterial(opts.color ?? TOY_COLORS[ch] ?? 0x161616));
  mesh.position.copy(position);
  mesh.quaternion.setFromEuler(new THREE.Euler(Math.random() - .5, Math.random() * Math.PI * 2, Math.random() - .5));
  world.add(mesh);
  const L = {
    ch, mesh,
    pos: mesh.position, vel: new THREE.Vector3(), angVel: new THREE.Vector3(.15, .25, .08),
    seed: Math.random() * 1000, dragged: false, dragTarget: new THREE.Vector3(), releaseAt: -1e9,
    squashT: 1e9, squashAxis: new THREE.Vector3(0, 0, 1)

  mesh.userData.letter = L;

  return L;
}

// smooth pseudo-noise "current" (sum of incommensurate sines; cheap and never repeats visibly)
function current(L, t, out) {
  const s = L.seed, p = L.pos;
  out.set(
    Math.sin(t * .13 + s + p.y * .35) + .6 * Math.sin(t * .071 + s * 1.7 + p.z * .28),
    .7 * Math.sin(t * .11 + s * 2.3 + p.x * .31) + .5 * Math.sin(t * .053 + s * .7),
    Math.sin(t * .09 + s * 3.1 + p.x * .27) + .6 * Math.sin(t * .067 + s * 1.1 + p.y * .33)
  );
  return out.multiplyScalar(.11);
}

function stepLetter(L, t, dt) {
  const acc = tmpV.set(0, 0, 0);
  if (L.dragged) {
    // follow the pointer on a stiff spring; it keeps spinning while carried
    const k = 70, c = 2 * Math.sqrt(k) * .9;
    acc.copy(L.dragTarget).sub(L.pos).multiplyScalar(k).addScaledVector(L.vel, -c);
    L.vel.addScaledVector(acc, dt);
    L.angVel.multiplyScalar(Math.exp(-WORLD.angDrag * dt));
  } else {

    const ramp = THREE.MathUtils.smoothstep(t - L.releaseAt, 0.4, 5.0);
    acc.addScaledVector(current(L, t, tmpV2), ramp);
    acc.y += Math.sin(t * .7 + L.seed) * .06 * ramp;
    const r = L.pos.length();
    if (r > WORLD.rMax) acc.addScaledVector(L.pos, -WORLD.wall * (r - WORLD.rMax) / r);
    if (r < WORLD.rMin) acc.addScaledVector(L.pos, WORLD.wall * 2 * (WORLD.rMin - r) / Math.max(r, .001));
    L.vel.addScaledVector(acc, dt);
    L.vel.multiplyScalar(Math.exp(-WORLD.drag * dt));
    const s = L.seed;
    tmpV2.set(Math.sin(t * .21 + s), Math.sin(t * .17 + s * 2.1), Math.sin(t * .13 + s * 3.7)).multiplyScalar(.075 * ramp);
    L.angVel.addScaledVector(tmpV2, dt);
    L.angVel.multiplyScalar(Math.exp(-WORLD.angDrag * dt));
  }
  L.pos.addScaledVector(L.vel, dt);

    // scale: shrink along axis, bulge perpendicular (approximate with per-axis weights)
    const ax = Math.abs(a.x), ay = Math.abs(a.y), az = Math.abs(a.z);

// ---------- ripple rings ----------
const ripples = [];
const ringGeo = new THREE.RingGeometry(.92, 1, 64);
function spawnRipple(point, delay = 0, maxScale = 1.4) {
  const m = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide, toneMapped: false }));
  m.position.copy(point); m.quaternion.copy(camera.quaternion); m.scale.setScalar(.01);
  world.add(m); ripples.push({ m, t: -delay, maxScale });
}
function stepRipples(dt) {
  for (let i = ripples.length - 1; i >= 0; i--) {
    const r = ripples[i]; r.t += dt;
    if (r.t < 0) continue;
    const k = r.t / .75;
    if (k >= 1) { world.remove(r.m); r.m.material.dispose(); ripples.splice(i, 1); continue; }
    const e = 1 - Math.pow(1 - k, 3);
    r.m.scale.setScalar(.1 + e * r.maxScale);
    r.m.material.opacity = .85 * (1 - k);

  grab() { blip(260, 820, .13, .22); },
  drop() { blip(700, 260, .15, .2); },
  pull() { blip(300, 900, .18, .2, 'triangle'); },
  win() { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => blip(f, f * 1.01, .45, .22, 'triangle'), i * 120)); }
};

// ---------- look controls (arrows + mouse drag), smoothed ----------
const look = { yaw: 0, pitch: 0, tYaw: 0, tPitch: 0 };
const PITCH_MAX = THREE.MathUtils.degToRad(80);
const keys = new Set();
const ARROW_SPEED = 1.7; // rad/s
addEventListener('keydown', e => {
  unlockAudio();
  if (e.key.startsWith('Arrow')) { keys.add(e.key); e.preventDefault(); }
  else if (e.key === 'Enter') { e.preventDefault(); if (!e.repeat && !renderer.xr.isPresenting) pokeAt(0, 0); }
  else if (e.code === 'Space') { e.preventDefault(); if (!e.repeat) pullCloser(); }
});
addEventListener('keyup', e => keys.delete(e.key));
addEventListener('blur', () => keys.clear());

const ptr = { down: false, id: null, x: 0, y: 0, sx: 0, sy: 0, moved: 0 };
const cv = renderer.domElement;
// press on a letter and drag = carry it; press on empty space and drag = look around
const toNdc = e => ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
const dragPlane = new THREE.Plane(), dragHit = new THREE.Vector3();
const drag = { L: null, offset: new THREE.Vector3() };
function dragTargetFrom(e) {
  toNdc(e); ray.setFromCamera(ndc, camera);
  if (ray.ray.intersectPlane(dragPlane, dragHit)) drag.L.dragTarget.copy(dragHit).add(drag.offset);
}
cv.addEventListener('pointerdown', e => {
  unlockAudio(); cv.focus();
  if (renderer.xr.isPresenting) return; // in VR the hands do the work
  Object.assign(ptr, { down: true, id: e.pointerId, x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, moved: 0 });
  cv.setPointerCapture(e.pointerId);
  toNdc(e); const h = pickLetter(ndc.x, ndc.y);
  if (h) {
    const B = h.L.word || h.L; // a spelled word is carried whole
    drag.L = B;
    dragPlane.setFromNormalAndCoplanarPoint(camera.getWorldDirection(tmpV).negate(), h.point);
    drag.offset.copy(B.pos).sub(h.point);
    B.dragTarget.copy(B.pos);
  }
});
cv.addEventListener('pointermove', e => {
  if (!ptr.down || e.pointerId !== ptr.id) return;
  const dx = e.clientX - ptr.x, dy = e.clientY - ptr.y;
  ptr.x = e.clientX; ptr.y = e.clientY;
  const was = ptr.moved; ptr.moved += Math.abs(dx) + Math.abs(dy);
  if (ptr.moved <= 6) return;
  cv.classList.add('drag');
  if (drag.L) {
    if (was <= 6) { drag.L.dragged = true; sfx.grab(); stats.grabs++; }
    dragTargetFrom(e);
  } else {
    const k = 2.4 / Math.max(innerHeight, 1);
    look.tYaw += dx * k; look.tPitch += dy * k;
    look.tPitch = THREE.MathUtils.clamp(look.tPitch, -PITCH_MAX, PITCH_MAX);
  }
});
const endPtr = e => {
  if (!ptr.down || e.pointerId !== ptr.id) return;
  ptr.down = false; cv.classList.remove('drag');
  const L = drag.L; drag.L = null;
  if (L && L.dragged) {
    // let go: keep the throw (inertia) and the spin; the water current takes over again
    L.dragged = false;
    if (L.vel.length() > 3) L.vel.setLength(3);
    L.releaseAt = clock.t - 1.5;
    sfx.drop(); stats.releases++;
  } else if (ptr.moved <= 6) pokeAt((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
};
cv.addEventListener('pointerup', endPtr);
cv.addEventListener('pointercancel', e => {
  ptr.down = false; cv.classList.remove('drag');
  if (drag.L) { drag.L.dragged = false; drag.L.releaseAt = clock.t - 1.5; drag.L = null; }
});
// holding a letter + Space = bring it close, right under the pointer (spelling distance)
const NEAR_DIST = 3.6;
function pullCloser() {
  if (!drag.L) return;
  toNdc({ clientX: ptr.x, clientY: ptr.y }); ray.setFromCamera(ndc, camera);
  const p = ray.ray.at(NEAR_DIST, new THREE.Vector3());
  dragPlane.setFromNormalAndCoplanarPoint(camera.getWorldDirection(tmpV).negate(), p);
  drag.offset.set(0, 0, 0);
  drag.L.dragTarget.copy(p);
  if (!drag.L.dragged) { drag.L.dragged = true; ptr.moved = 99; stats.grabs++; }
  sfx.pull();
}

// two fingers on the touchpad (or the mouse wheel) = look around
cv.addEventListener('wheel', e => {
  e.preventDefault(); unlockAudio();
  const k = (e.deltaMode === 1 ? 16 : 1) * 0.0025;
  look.tYaw += e.deltaX * k; look.tPitch += e.deltaY * k;
  look.tPitch = THREE.MathUtils.clamp(look.tPitch, -PITCH_MAX, PITCH_MAX);
  if (drag.L) dragTargetFrom({ clientX: ptr.x, clientY: ptr.y });
}, { passive: false });

// ---------- interaction: poke + grab ----------
const ray = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const dotEl = document.getElementById('dot');
function pickLetter(x, y) {
  ndc.set(x, y); ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(letters.map(l => l.mesh), false)[0];
  return hit ? { L: hit.object.userData.letter, point: hit.point } : null;
}
function pokeAt(x, y) {
  const h = pickLetter(x, y);
  if (!h) { dotEl.classList.remove('no'); void dotEl.offsetWidth; dotEl.classList.add('no'); return false; }
  const { L: hitL, point } = h, L = hitL.word || hitL;
  const dir = tmpV.copy(point).sub(camera.position).normalize();
  L.vel.addScaledVector(dir, 2.3);
  L.vel.x += (Math.random() - .5) * .5; L.vel.y += (Math.random() - .3) * .5;
  // spin from off-centre hit: torque = r x F
  const arm = tmpV2.copy(point).sub(L.pos);
  const torque = new THREE.Vector3().crossVectors(arm, dir).multiplyScalar(3.2);
  torque.add(new THREE.Vector3(Math.random() - .5, Math.random() - .5, Math.random() - .5).multiplyScalar(1.2));
  L.angVel.add(L.members ? torque.divideScalar(L.members.length) : torque);
  L.releaseAt = clock.t - 1.5; // current keeps blending in
  // squash along hit direction in letter-local space
  hitL.squashAxis.copy(dir).applyQuaternion(tmpQ.copy(hitL.mesh.quaternion).invert()).normalize();
  hitL.squashT = clock.t;
  spawnRipple(point, 0, 1.3); spawnRipple(point, .12, 2.0);
  sfx.plop();
  stats.pokes++;
  return true;
}

// ---------- post (bloom) ----------
let composer = null, bloom = null;
function buildComposer() {
  const size = renderer.getDrawingBufferSize(new THREE.Vector2());
  const rt = new THREE.WebGLRenderTarget(size.x, size.y, { type: THREE.HalfFloatType, samples: 4 });
  composer = new EffectComposer(renderer, rt);
  composer.addPass(new RenderPass(scene, camera));
  bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth / 2, innerHeight / 2), .32, .55, .92);
  composer.addPass(bloom);
  composer.addPass(new OutputPass());
}
let useBloom = QUALITY !== 'low';
if (useBloom) buildComposer();

function resize() {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setPixelRatio(pixelRatio); renderer.setSize(innerWidth, innerHeight);
  if (composer) { composer.setPixelRatio(pixelRatio); composer.setSize(innerWidth, innerHeight); }
  bubbleUniforms.uScale.value = (innerHeight * pixelRatio * .5) / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
}
addEventListener('resize', resize);
resize();

// ---------- the alphabet: A–Z, a–z and the 18 Lithuanian letters, spread evenly all around the player ----------
const ALPHABET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz' + 'ĄČĘĖĮŠŲŪŽąčęėįšųūž'; // + Lithuanian (Kris 2026-10-30)
const shuffled = [...ALPHABET].sort(() => Math.random() - .5);
shuffled.forEach((ch, i) => {
  // fibonacci sphere for even directions, random depth inside the bubble shell
  const n = shuffled.length, y = 1 - (i + .5) / n * 2, rr = Math.sqrt(1 - y * y), th = i * Math.PI * (3 - Math.sqrt(5));
  const dir = new THREE.Vector3(Math.cos(th) * rr, y * .8, Math.sin(th) * rr).normalize();
  const L = addLetter(ch, dir.multiplyScalar(4.5 + Math.random() * 4.5));
  L.vel.set(Math.random() - .5, Math.random() - .5, Math.random() - .5).multiplyScalar(.1);
  L.angVel.set(Math.random() - .5, Math.random() - .5, Math.random() - .5).multiplyScalar(.5);
});
// re-spread every letter on a fresh fibonacci shell between r0 and r1 (world units); used by VR start and VR replay
function scatterLetters(r0, r1, ySquash = .8) {
  breakWords();
  const n = letters.length, order = letters.map((_, i) => i).sort(() => Math.random() - .5);
  order.forEach((k, i) => {
    const L = letters[k];
    const y = 1 - (i + .5) / n * 2, rr = Math.sqrt(1 - y * y), th = i * Math.PI * (3 - Math.sqrt(5));
    L.pos.set(Math.cos(th) * rr, y * ySquash, Math.sin(th) * rr).normalize().multiplyScalar(r0 + Math.random() * (r1 - r0));
    L.vel.set(Math.random() - .5, Math.random() - .5, Math.random() - .5).multiplyScalar(.1);
    L.angVel.set(Math.random() - .5, Math.random() - .5, Math.random() - .5).multiplyScalar(.5);
    L.dragged = false; L.releaseAt = -1e9;
  });
}

// letters gently push apart so they don't float through each other
function separate(dt) {
  for (let i = 0; i < letters.length; i++) for (let j = i + 1; j < letters.length; j++) {
    const A = letters[i], B = letters[j];
    if (A.word && A.word === B.word) continue;
    tmpV.copy(A.pos).sub(B.pos); const d = tmpV.length();
    if (d < WORLD.gap && d > 1e-4) {
      tmpV.multiplyScalar((WORLD.gap - d) * 2.5 * dt / d);
      const a = A.word || A, b = B.word || B; // a word is heavier than one letter
      if (!a.dragged) a.vel.addScaledVector(tmpV, A.word ? 1 / A.word.members.length : 1);
      if (!b.dragged) b.vel.addScaledVector(tmpV, B.word ? -1 / B.word.members.length : -1);
    }
  }
}

// ---------- a spelled word sticks together and floats on as one body ----------
// The letters keep their own meshes; every frame they're placed rigidly around the word body, which runs the
// same physics as a single letter. Grab, poke or push any one of its letters and the whole word moves.
const words = [];
const WORD_SNAP = .45, WORD_GAP = .06; // seconds to click into a line; space between letters (world units)
function formWord(row) {
  const W = { ch: row.map(l => l.ch).join(''), members: row, mesh: new THREE.Object3D(), vel: new THREE.Vector3(), angVel: new THREE.Vector3(),
    seed: Math.random() * 1000, dragged: false, dragTarget: new THREE.Vector3(), releaseAt: clock.t,
    squashT: 1e9, squashAxis: new THREE.Vector3(0, 0, 1), formT: clock.t, slots: [] };
  W.pos = W.mesh.position;
  camera.getWorldQuaternion(W.mesh.quaternion); // facing you
  // lay the letters out like typed text: side by side on one baseline
  let x = 0;
  const lay = row.map(L => {
    const g = L.mesh.geometry, w = g.boundingBox.max.x - g.boundingBox.min.x;
    const p = { x: x + w / 2, y: g.userData.glyphCentre.y }; x += w + WORD_GAP; return p;
  });
  const midX = (x - WORD_GAP) / 2, midY = lay.reduce((a, p) => a + p.y, 0) / row.length;
  for (const L of row) { W.pos.add(L.pos); W.vel.add(L.vel); }
  W.pos.divideScalar(row.length); W.vel.divideScalar(row.length);
  row.forEach((L, i) => {
    L.word = W; L.dragged = false;
    W.slots.push({ off: new THREE.Vector3(lay[i].x - midX, lay[i].y - midY, 0), p0: L.pos.clone(), q0: L.mesh.quaternion.clone() });
  });
  words.push(W);
  return W;
}
function syncWord(W, t) {
  const k = THREE.MathUtils.smoothstep(t - W.formT, 0, WORD_SNAP);
  W.members.forEach((L, i) => {
    const s = W.slots[i];
    tmpV2.copy(s.off).applyQuaternion(W.mesh.quaternion).add(W.pos);
    L.pos.lerpVectors(s.p0, tmpV2, k);
    L.mesh.quaternion.slerpQuaternions(s.q0, W.mesh.quaternion, k);
    L.vel.copy(W.vel); L.dragged = W.dragged;
    applySquash(L, t);
  });
}
function breakWords() {
  for (const W of words) for (const L of W.members) { L.word = null; L.dragged = false; L.vel.copy(W.vel); L.angVel.copy(W.angVel); }
  words.length = 0;
}
function stepAll(t, dt) {
  for (const L of letters) if (!L.word) stepLetter(L, t, dt);
  for (const W of words) { stepLetter(W, t, dt); syncWord(W, t); }
}

// ---------- goal: build any real word (3+ letters) until the letters run out ----------
// Letter size is 1.6 units per em: a capital is ~1.05 tall, most letters ~0.6–1.4 wide,
// so in a tight word their centres sit ~1.1 apart. A row of FREE letters (not in a word, not in your hand) counts when:
//   • each letter is within 6 units of you and in front of you
//   • reading order left → right on screen (head-space x)
//   • neighbour centres 0.7–2.0 apart (touching up to about one letter-width gap)
//   • roughly one line: up/down offset ≤ 0.6, depth offset ≤ 1.2 between neighbours
//   • the same letters stay lined up for 0.6 s, so it isn't a fly-by
// Any chain of such neighbours is read left to right; the longest run of 3+ letters in it that is a real
// English or Lithuanian word (any mix of capitals and small letters) clicks together into one floating word.
// No new letters ever appear: the round ends when every letter is in a word (or you press "done").
const WIN_RULE = { reach: 6, minGap: .7, maxGap: 2.0, maxDy: .6, maxDz: 1.2, hold: .6 };
const DICT = (() => {
  const d = JSON.parse(document.getElementById('dict').textContent);
  const en = d.en.split(' '), lt = d.lt.split(' ');
  const all = en.concat(lt).sort();
  return { en: en.length, lt: lt.length, set: new Set(all), sorted: all };
})();
const fold = s => s.toLocaleLowerCase('lt');
const isWord = s => DICT.set.has(fold(s));
function hasPrefix(p) { // binary search in the sorted list: is any word starting with p?
  const a = DICT.sorted; let lo = 0, hi = a.length;
  while (lo < hi) { const m = (lo + hi) >> 1; if (a[m] < p) lo = m + 1; else hi = m; }
  return lo < a.length && a[lo].startsWith(p);
}
const hudEl = document.getElementById('hud'), leftEl = document.getElementById('left'), leftNum = leftEl.querySelector('b');
const wordsEl = document.getElementById('words'), winEl = document.getElementById('win'), sumEl = winEl.querySelector('.sum');
let won = false; // true = round over (all letters used, or "done"); the name stays for the QA hooks
const cand = { key: '', hold: 0 };
const lettersLeft = () => letters.reduce((n, l) => n + (l.word ? 0 : 1), 0);
// letter centre in HEAD (camera) space, measured in world units: desktop → plain view space; VR → headset space ÷ world scale
const camV = l => world.localToWorld(l.pos.clone()).applyMatrix4(camera.matrixWorldInverse).divideScalar(world.scale.x);
function findWord() {
  const near = [];
  for (const l of letters) {
    if (l.word || l.dragged) continue;
    const v = camV(l);
    if (v.z < 0 && v.length() <= WIN_RULE.reach) near.push({ l, v, s: fold(l.ch), nx: [] });
  }
  if (near.length < 3) return null;
  near.sort((a, b) => a.v.x - b.v.x);
  for (let i = 0; i < near.length; i++) for (let j = i + 1; j < near.length; j++) {
    const a = near[i].v, b = near[j].v, d = a.distanceTo(b);
    if (a.x < b.x && d >= WIN_RULE.minGap && d <= WIN_RULE.maxGap && Math.abs(a.y - b.y) <= WIN_RULE.maxDy && Math.abs(a.z - b.z) <= WIN_RULE.maxDz) near[i].nx.push(near[j]);
  }
  // every left→right path through neighbours, from every start (so every contiguous run of a chain is tried);
  // a path stops growing as soon as no word starts with it
  let best = null, steps = 0;
  const path = [];
  const walk = (n, str) => {
    if (++steps > 4000) return;
    path.push(n.l); str += n.s;
    if (path.length >= 3 && DICT.set.has(str) && (!best || path.length > best.length)) best = path.slice();
    if (path.length < 10) for (const m of n.nx) if (hasPrefix(str + m.s)) walk(m, str);
    path.pop();
  };
  for (const n of near) if (n.nx.length) walk(n, '');
  return best;
}
function checkWord(dt) {
  if (won) return;
  const row = findWord();
  const key = row ? row.map(l => letters.indexOf(l)).join(',') : '';
  cand.hold = key && key === cand.key ? cand.hold + dt : 0;
  cand.key = key;
  if (row && cand.hold >= WIN_RULE.hold) { cand.key = ''; cand.hold = 0; madeWord(formWord(row)); }
}
function madeWord(W) {
  sfx.word();
  W.members.forEach((l, i) => spawnRipple(l.pos.clone(), i * .06, 2.0));
  renderHud(true);
  if (lettersLeft() === 0) setTimeout(() => endRound(), 700);
}
function renderHud(fresh) {
  const n = lettersLeft();
  if (leftNum.textContent !== String(n)) { leftNum.textContent = n; leftEl.classList.remove('bump'); void leftEl.offsetWidth; leftEl.classList.add('bump'); }
  wordsEl.textContent = '';
  for (let i = words.length - 1; i >= 0; i--) {
    const s = document.createElement('span'); s.textContent = words[i].ch;
    if (fresh && i === words.length - 1) s.className = 'new';
    wordsEl.appendChild(s);
  }
  vr.panelSig = '';
}
function endRound() {
  if (won) return;
  won = true; hudEl.classList.add('end');
  const n = words.length, left = lettersLeft();
  sumEl.innerHTML = '';
  sumEl.append(String(n));
  const sm = document.createElement('small');
  sm.textContent = (n === 1 ? 'word' : 'words') + (left ? ` · ${left} letters left` : ' · every letter used!');
  sumEl.appendChild(sm);
  winEl.classList.add('show'); sfx.win();
  for (const W of words) for (const l of W.members) spawnRipple(l.pos.clone(), Math.random() * .3, 2.2);
  vr.panelSig = '';
}
document.getElementById('again').addEventListener('click', () => resetGame());
document.getElementById('done').addEventListener('click', () => { unlockAudio(); endRound(); });
// new round, same 70 letters: words break up and everything is scattered again (desktop and VR)
function resetGame() {
  won = false; cand.key = ''; cand.hold = 0;
  hudEl.classList.remove('end'); winEl.classList.remove('show');
  for (const H of vr.hands) H.held = null;
  if (drag.L) { drag.L.dragged = false; drag.L = null; }
  ptr.down = false;
  breakWords();
  if (renderer.xr.isPresenting && vr.anchored) scatterLetters(VR_M.spawnMin / vr.S, VR_M.spawnMax / vr.S, .55);
  else scatterLetters(4.5, 9, .8);
  renderHud(false);
}

// ---------- WebXR (VR mode): hands, controllers, distance grab, push-away, floating goal panel ----------
// The physics never changes: it runs in world units. In VR the `world` group is scaled so a capital is ~22 cm
// and centred on the head at session start; everything measured in metres (VR_M) is divided by vr.S.
const VR_M = {
  letterH: .22, eyeMin: .35, eyeMax: 3.0, spawnMin: .5, spawnMax: 2.4,   // letter size, float shell, spawn shell
  pinchOn: .02, pinchOff: .035, grabReach: .08, letterR: .09,               // pinch hysteresis, direct-grab reach, letter contact radius
  tipR: .012, palmR: .035, ctrlR: .045,                                     // contact spheres
  throwMax: 2.5, velWindow: .1, rayMax: 6, rayStub: .3, aimAssist: .09,     // throw clamp (m/s), velocity window (s), pointer ray
  pushBase: .22, pushGain: 1.1, releaseGrace: .4,                           // push-away kick
  panelDist: 1.0, panelDrop: .28, pokeR: .05                                // goal panel + replay button
};
const DESK_WORLD = { rMin: WORLD.rMin, rMax: WORLD.rMax };
const capBox = (() => { const g = letters.find(l => l.ch === 'C').mesh.geometry; g.computeBoundingBox(); return g.boundingBox; })();
const vr = {
  S: VR_M.letterH / (capBox.max.y - capBox.min.y), anchored: false, hands: [], t: 0, resetAt: -9,
  head: new THREE.Vector3(0, 1.6, 0), headQ: new THREE.Quaternion(), lit: new Set(), panelSig: ''
};
const vA = new THREE.Vector3(), vB = new THREE.Vector3(), vC = new THREE.Vector3(), vD = new THREE.Vector3(), qA = new THREE.Quaternion();
const xrRay = new THREE.Raycaster();
const TIPS = ['thumb-tip', 'index-finger-tip', 'middle-finger-tip', 'ring-finger-tip', 'pinky-finger-tip'];
const handFactory = new XRHandModelFactory();
const rayGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0, -1)]);
const AIM_GLOW = new THREE.Color(0x2f8fb8);
sfx.touch = () => blip(560, 210, .14, .12);

for (let i = 0; i < 2; i++) {
  const ctrl = renderer.xr.getController(i), grip = renderer.xr.getControllerGrip(i), hand = renderer.xr.getHand(i);
  rig.add(ctrl, grip, hand);
  hand.add(handFactory.createHandModel(hand, 'spheres'));          // primitive spheres: no model download
  const pad = new THREE.Mesh(new THREE.CapsuleGeometry(.02, .07, 4, 12), new THREE.MeshStandardMaterial({ color: 0x1c1c1c, roughness: .55 }));
  pad.rotation.x = -Math.PI / 2; pad.visible = false; grip.add(pad);
  const line = new THREE.Line(rayGeo, new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: .5, depthWrite: false }));
  line.visible = false; ctrl.add(line);
  const dot = new THREE.Mesh(new THREE.SphereGeometry(.007, 12, 8), new THREE.MeshBasicMaterial({ color: 0xffe36b, toneMapped: false }));
  dot.visible = false; scene.add(dot);
  const H = { i, ctrl, grip, hand, pad, line, dot, kind: null, sel: false, sqz: false, pinch: false, wasPinch: false, tracked: false,
              held: null, aimed: null, aimBtn: false, pt: new THREE.Vector3(), grabOff: new THREE.Vector3(), hist: [], vel: new THREE.Vector3(), prev: {} };
  ctrl.addEventListener('connected', e => { H.kind = e.data && e.data.hand ? 'hand' : 'ctrl'; H.src = e.data; H.side = e.data ? e.data.handedness : ''; pad.visible = H.kind === 'ctrl'; H.hist.length = 0; H.prev = {}; });
  ctrl.addEventListener('disconnected', () => { releaseHeld(H, false); H.kind = null; H.pinch = H.wasPinch = H.sel = H.sqz = false; line.visible = dot.visible = pad.visible = false; });
  ctrl.addEventListener('selectstart', () => { H.sel = true; });
  ctrl.addEventListener('selectend', () => { H.sel = false; });
  ctrl.addEventListener('squeezestart', () => { H.sqz = true; });
  ctrl.addEventListener('squeezeend', () => { H.sqz = false; });
  vr.hands.push(H);
}

// goal panel: C A T tiles on a canvas texture, ~1 m ahead and a little low, follows your gaze lazily
const panelCv = document.createElement('canvas'); panelCv.width = 512; panelCv.height = 200;
const panelTex = new THREE.CanvasTexture(panelCv); panelTex.colorSpace = THREE.SRGBColorSpace;
const panel = new THREE.Mesh(new THREE.PlaneGeometry(.36, .36 * 200 / 512),
  new THREE.MeshBasicMaterial({ map: panelTex, transparent: true, toneMapped: false, depthWrite: false }));
panel.visible = false; panel.renderOrder = 5; scene.add(panel);
const btnCv = document.createElement('canvas'); btnCv.width = btnCv.height = 128;
{ const c = btnCv.getContext('2d'); c.fillStyle = '#111'; c.beginPath(); c.arc(64, 64, 62, 0, Math.PI * 2); c.fill();
  c.fillStyle = '#fff'; c.font = '700 76px system-ui, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('↻', 64, 70); }
const btnTex = new THREE.CanvasTexture(btnCv); btnTex.colorSpace = THREE.SRGBColorSpace;
const replayBtn = new THREE.Mesh(new THREE.CircleGeometry(.04, 40), new THREE.MeshBasicMaterial({ map: btnTex, transparent: true, toneMapped: false }));
replayBtn.position.set(0, -.11, .004); replayBtn.visible = false; panel.add(replayBtn);
function drawPanel() {
  const sig = goalTiles.map(t => t.classList.contains('near') ? 1 : 0).join('') + (won ? 'W' : '');
  if (sig === vr.panelSig) return;
  vr.panelSig = sig;
  const c = panelCv.getContext('2d'); c.clearRect(0, 0, 512, 200);
  const rr = (x, y, w, h, r) => { c.beginPath(); c.roundRect ? c.roundRect(x, y, w, h, r) : c.rect(x, y, w, h); };
  c.fillStyle = 'rgba(255,255,255,.35)'; rr(4, 4, 504, 192, 34); c.fill();
  [...WORD].forEach((ch, i) => {
    const near = sig[i] === '1', x = 46 + i * 150, y = won ? 16 : 26;
    c.fillStyle = won ? '#ffe36b' : near ? '#fff' : 'rgba(255,255,255,.55)'; rr(x, y, 120, 148, 22); c.fill();
    if (near || won) { c.lineWidth = 5; c.strokeStyle = '#111'; rr(x + 2.5, y + 2.5, 115, 143, 20); c.stroke(); }
    c.fillStyle = near || won ? '#111' : 'rgba(15,42,58,.35)';
    c.font = '400 112px "Times New Roman", Tinos, serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(ch, x + 60, y + 80);
  });
  panelTex.needsUpdate = true;
  replayBtn.visible = won;
}
function placePanel(dt, snap) {
  vA.set(0, 0, -1).applyQuaternion(vr.headQ); vA.y = 0;
  if (vA.lengthSq() < 1e-4) vA.set(0, 0, -1);
  vA.normalize();
  vB.copy(vr.head).addScaledVector(vA, VR_M.panelDist); vB.y -= VR_M.panelDrop;
  const k = snap ? 1 : 1 - Math.exp(-1.4 * dt);
  panel.position.lerp(vB, k);
  qA.copy(panel.quaternion); panel.lookAt(vr.head); const want = panel.quaternion.clone();
  panel.quaternion.copy(qA).slerp(want, k);
}

function anchorWorld() {
  world.position.copy(vr.head); world.scale.setScalar(vr.S); world.updateMatrixWorld(true);
  WORLD.rMin = VR_M.eyeMin / vr.S; WORLD.rMax = VR_M.eyeMax / vr.S;
  won = false; winHold = 0; goalEl.classList.remove('win'); winEl.classList.remove('show');
  scatterLetters(VR_M.spawnMin / vr.S, VR_M.spawnMax / vr.S, .55);
  vr.anchored = true; panel.visible = true; vr.panelSig = ''; placePanel(0, true);
}
const toLocal = p => world.worldToLocal(p);                          // scene metres → world units (in place)
const toScene = (L, out) => world.localToWorld(out.copy(L.pos));    // letter centre in scene metres

function grab(H, hitL, far) {
  const L = hitL.word || hitL; // a spelled word is carried whole
  for (const o of vr.hands) if (o !== H && o.held === L) o.held = null;
  H.held = L; L.dragged = true; L.vrFar = far;
  // a word keeps the spot you pinched (its middle isn't under your fingers); single letters snap to the pinch
  H.grabOff.set(0, 0, 0);
  if (L.members && !far) H.grabOff.copy(L.pos).sub(toLocal(vA.copy(H.pt)));
  L.dragTarget.copy(toLocal(vA.copy(H.pt))).add(H.grabOff);
  far ? sfx.pull() : sfx.grab(); stats.grabs++;
}
function releaseHeld(H, throwIt = true) {
  const L = H.held; if (!L) return;
  H.held = null; L.dragged = false;
  if (throwIt && toScene(L, vA).distanceTo(H.pt) < .2 + H.grabOff.length() * vr.S) {
    // a throw: the hand's velocity over the last ~100 ms, clamped; the spin it already had is kept
    vB.copy(H.vel); if (vB.length() > VR_M.throwMax) vB.setLength(VR_M.throwMax);
    L.vel.copy(vB).divideScalar(vr.S);
  } else if (L.vel.length() > 3) L.vel.setLength(3);
  L.releaseAt = clock.t - 1.5; L.vrReleaseT = vr.t;
  sfx.drop(); stats.releases++;
}

function updateHand(H, dt) {
  if (!H.kind) return;
  // 1) pinch point + pinch state (hands: thumb tip ↔ index tip with hysteresis; controllers: trigger or squeeze)
  if (H.kind === 'hand') {
    const th = H.hand.joints['thumb-tip'], ix = H.hand.joints['index-finger-tip'];
    H.tracked = !!(th && ix && th.visible && ix.visible);
    if (H.tracked) {
      th.getWorldPosition(vA); ix.getWorldPosition(vB);
      const d = vA.distanceTo(vB);
      H.pinch = H.pinch ? d < VR_M.pinchOff : d < VR_M.pinchOn;
      H.pt.addVectors(vA, vB).multiplyScalar(.5);
    } else H.pinch = false;
  } else {
    H.tracked = H.grip.visible || H.ctrl.visible;
    (H.grip.visible ? H.grip : H.ctrl).getWorldPosition(H.pt);
    H.pinch = H.tracked && (H.sel || H.sqz);
  }
  if (!H.tracked) { if (H.held) releaseHeld(H, false); H.line.visible = H.dot.visible = false; H.aimed = null; H.wasPinch = false; return; }
  // 2) hand velocity, averaged over the last ~100 ms
  H.hist.push({ t: vr.t, p: H.pt.clone() });
  while (H.hist.length > 2 && vr.t - H.hist[0].t > VR_M.velWindow) H.hist.shift();
  const h0 = H.hist[0], h1 = H.hist[H.hist.length - 1];
  if (h1.t - h0.t > 1e-4) H.vel.subVectors(h1.p, h0.p).divideScalar(h1.t - h0.t); else H.vel.set(0, 0, 0);
  // 3) pointer ray from the target-ray space (index-finger pointing on hands, the controller's nose otherwise)
  H.aimed = null; H.aimBtn = false;
  let len = VR_M.rayStub;
  if (!H.held && H.ctrl.visible) {
    H.ctrl.getWorldPosition(vC); vD.set(0, 0, -1).applyQuaternion(H.ctrl.getWorldQuaternion(qA));
    xrRay.set(vC, vD); xrRay.far = VR_M.rayMax;
    const targets = letters.filter(l => !l.dragged).map(l => l.mesh);
    if (replayBtn.visible) targets.push(replayBtn);
    let hit = xrRay.intersectObjects(targets, false)[0];
    if (!hit) {
      // aim assist: thin serif letters have holes, so also take the letter whose centre passes closest to the ray
      let bestD = VR_M.aimAssist;
      for (const L of letters) {
        if (L.dragged) continue;
        toScene(L, vA);
        const along = vB.subVectors(vA, vC).dot(vD);
        if (along < .1 || along > VR_M.rayMax) continue;
        const off = vB.copy(vC).addScaledVector(vD, along).distanceTo(vA);
        if (off < bestD) { bestD = off; hit = { distance: along, point: vA.clone(), object: L.mesh }; }
      }
    }
    if (hit) {
      len = hit.distance;
      if (hit.object === replayBtn) H.aimBtn = true; else H.aimed = hit.object.userData.letter;
      H.dot.position.copy(hit.point); H.dot.visible = true;
    } else H.dot.visible = false;
    H.line.scale.z = len; H.line.visible = true;
  } else { H.line.visible = false; H.dot.visible = false; }
  // 4) pinch edges: near letter first, else the aimed far letter flies to the hand (replaces Space)
  if (H.pinch && !H.wasPinch) {
    if (H.aimBtn && won) { resetGame(); sfx.grab(); }
    else {
      let best = null, bd = Infinity;
      for (const L of letters) {
        if (L.dragged) continue;
        const d = toScene(L, vA).distanceTo(H.pt) - VR_M.letterR;
        if (d < VR_M.grabReach && d < bd) { bd = d; best = L; }
      }
      if (best) grab(H, best, false); else if (H.aimed) grab(H, H.aimed, true);

  if (H.held) H.held.dragTarget.copy(toLocal(vA.copy(H.pt))).add(H.grabOff);
}

// every joint (palm + 5 fingertips, or the controller body) is a sphere; letters it touches get pushed away
function contactSpheres(H, out) {
  if (!H.kind || !H.tracked) return out;
  if (H.kind === 'hand') {
    const j = H.hand.joints;
    const palm = j['middle-finger-metacarpal'];
    if (palm && palm.visible) out.push({ H, key: 'palm', r: VR_M.palmR, p: palm.getWorldPosition(new THREE.Vector3()) });
    for (const name of TIPS) { const o = j[name]; if (o && o.visible) out.push({ H, key: name, r: VR_M.tipR, p: o.getWorldPosition(new THREE.Vector3()) }); }
  } else out.push({ H, key: 'grip', r: VR_M.ctrlR, p: H.pt.clone() });
  return out;
}
function pushAway(dt) {
  const spheres = [];
  for (const H of vr.hands) contactSpheres(H, spheres);
  for (const s of spheres) {
    const prev = s.H.prev[s.key];
    s.v = prev && dt > 0 ? s.p.clone().sub(prev).divideScalar(dt) : new THREE.Vector3();
    if (s.v.length() > 6) s.v.setLength(6);
    s.H.prev[s.key] = s.p.clone();
  }
  for (const L of letters) {
    const B = L.word || L, m = B === L ? 1 : 1 / B.members.length; // touching a word's letter shoves the whole (heavier) word
    if (B.dragged || vr.t - (B.vrReleaseT ?? -9) < VR_M.releaseGrace) continue;
    for (const s of spheres) {
      toScene(L, vA);
      const minD = s.r + VR_M.letterR, d = vA.distanceTo(s.p);
      if (d >= minD || d < 1e-5) continue;
      const n = vB.subVectors(vA, s.p).divideScalar(d);
      B.pos.addScaledVector(n, (minD - d) / vr.S);                       // out of the hand
      if (B !== L) L.pos.addScaledVector(n, (minD - d) / vr.S);
      const closing = s.v.dot(n) - B.vel.dot(n) * vr.S;                   // m/s toward the letter
      const fresh = vr.t - (L.vrTouchT ?? -9) > .35;
      const kick = Math.max(0, closing) * VR_M.pushGain + (fresh ? VR_M.pushBase : 0);
      B.vel.addScaledVector(n, kick * m / vr.S).addScaledVector(s.v, .25 * m / vr.S);
      B.releaseAt = clock.t - 1.5;
      if (fresh) {
        L.vrTouchT = vr.t;
        B.angVel.add(vC.crossVectors(n, s.v).multiplyScalar(5 * m)).add(vD.set(Math.random() - .5, Math.random() - .5, Math.random() - .5).multiplyScalar(.8));
        L.squashAxis.copy(n).applyQuaternion(qA.copy(L.mesh.quaternion).invert()).normalize(); L.squashT = clock.t;
        spawnRipple(toLocal(vC.copy(s.p).addScaledVector(n, s.r)), 0, .9);
        sfx.touch(); stats.pushes = (stats.pushes || 0) + 1;
      }
    }
  }
}

function xrUpdate(xrFrame, dt) {
  vr.t += dt;
  const ref = renderer.xr.getReferenceSpace();
  const pose = xrFrame && ref ? xrFrame.getViewerPose(ref) : null;
  if (pose) {
    const p = pose.transform.position, o = pose.transform.orientation;
    vr.head.set(p.x, p.y, p.z); vr.headQ.set(o.x, o.y, o.z, o.w);
    camera.position.copy(vr.head); camera.quaternion.copy(vr.headQ);   // fresh head pose for WIN_RULE (renderer sets the same)
  }
  rig.updateMatrixWorld(true);
  if (!vr.anchored) { if (!pose) return; anchorWorld(); }
  for (const H of vr.hands) updateHand(H, dt);
  pushAway(dt);
  // aim highlight
  for (const L of vr.lit) L.mesh.material.emissive.setRGB(0, 0, 0);
  vr.lit.clear();
  for (const H of vr.hands) if (H.aimed) for (const L of H.aimed.word ? H.aimed.word.members : [H.aimed]) { L.mesh.material.emissive.copy(AIM_GLOW); vr.lit.add(L); }
  // goal panel + poke-able replay
  placePanel(dt, false); drawPanel();
  if (won && replayBtn.visible && vr.t - vr.resetAt > 1) {
    replayBtn.getWorldPosition(vC);
    for (const H of vr.hands) {
      if (!H.tracked) continue;
      const tip = H.kind === 'hand' ? H.hand.joints['index-finger-tip'] : null;
      (tip && tip.visible ? tip.getWorldPosition(vD) : vD.copy(H.pt));
      if (vD.distanceTo(vC) < VR_M.pokeR) { vr.resetAt = vr.t; resetGame(); sfx.grab(); break; }
    }
  }
}

const vrBtn = document.getElementById('vrbtn');
if (navigator.xr && navigator.xr.isSessionSupported) {
  navigator.xr.isSessionSupported('immersive-vr').then(ok => vrBtn.classList.toggle('ok', ok)).catch(() => {});
}
vrBtn.addEventListener('click', async () => {
  unlockAudio();
  const cur = renderer.xr.getSession();
  if (cur) { cur.end(); return; }
  try {
    const s = await navigator.xr.requestSession('immersive-vr', { optionalFeatures: ['local-floor', 'hand-tracking'] });
    await renderer.xr.setSession(s);
  } catch (e) { console.info('VR session not started:', e.message); }
});
renderer.xr.addEventListener('sessionstart', () => {
  vr.anchored = false; vr.t = 0; vrBtn.querySelector('span').textContent = 'Exit VR';
});
renderer.xr.addEventListener('sessionend', () => {
  for (const H of vr.hands) { releaseHeld(H, false); H.kind = null; H.line.visible = H.dot.visible = false; }
  for (const L of vr.lit) L.mesh.material.emissive.setRGB(0, 0, 0);
  vr.lit.clear(); vr.anchored = false; panel.visible = false;
  world.position.set(0, 0, 0); world.scale.setScalar(1); world.updateMatrixWorld(true);
  WORLD.rMin = DESK_WORLD.rMin; WORLD.rMax = DESK_WORLD.rMax;
  won = false; winHold = 0; goalEl.classList.remove('win'); winEl.classList.remove('show');
  scatterLetters(4.5, 9, .8);
  camera.position.set(0, 0, 0); camera.fov = 62; camera.zoom = 1; resize();
  vrBtn.querySelector('span').textContent = 'Enter VR';

// ---------- loop ----------
const clock = { t: 0, scale: 1, paused: false };
const stats = { pokes: 0, grabs: 0, releases: 0, frames: 0, counted: 0, realT: 0, fps: 0, decided: false, quality: useBloom ? 'bloom' : 'plain' };
let last = performance.now();
const fwd = new THREE.Vector3();
function frame(now, xrFrame) {
  // driven by renderer.setAnimationLoop: window rAF on desktop, the headset's frame loop in VR
  const rawDt = Math.max(0, (now - last) / 1000); last = now;
  const rdt = Math.min(rawDt, 1 / 20);
  const dt = clock.paused ? 0 : rdt * clock.scale;
  clock.t += dt;
  const inXR = renderer.xr.isPresenting;

  // auto quality: measure ~3 s after warm-up; under ~40 fps → drop bloom and pixel ratio
  if (QUALITY === 'auto' && !stats.decided && !inXR) {
    stats.frames++;
    if (stats.frames > 10) { stats.realT += Math.min(rawDt, .5); stats.counted++; }
    if (stats.realT > 3) {
      stats.decided = true; stats.fps = Math.round(stats.counted / stats.realT);
      if (stats.fps < 40 && useBloom) { useBloom = false; stats.quality = 'plain'; pixelRatio = 1; resize(); }
    }
  }

  if (inXR) xrUpdate(xrFrame, rdt); // head pose comes from the headset; hands grab / push / throw
  else {
    // look
    const ky = (keys.has('ArrowLeft') ? 1 : 0) - (keys.has('ArrowRight') ? 1 : 0);
    const kp = (keys.has('ArrowUp') ? 1 : 0) - (keys.has('ArrowDown') ? 1 : 0);
    look.tYaw += ky * ARROW_SPEED * rdt;
    look.tPitch = THREE.MathUtils.clamp(look.tPitch + kp * ARROW_SPEED * .8 * rdt, -PITCH_MAX, PITCH_MAX);
    const a = 1 - Math.exp(-9 * rdt);
    look.yaw += (look.tYaw - look.yaw) * a;
    look.pitch += (look.tPitch - look.pitch) * a;
    camera.rotation.set(look.pitch, look.yaw, 0);
    camera.updateMatrixWorld();
  }

  separate(dt);
  checkWord(rdt);
  stepAll(clock.t, dt);
  stepRipples(dt);
  blobUniforms.uT.value = clock.t; bubbleUniforms.uT.value = clock.t;

  if (inXR) { renderer.render(scene, camera); return; } // no bloom composer in WebXR

  // crosshair feedback
  dotEl.classList.toggle('on', !!pickLetter(0, 0));

  if (useBloom && composer) composer.render(); else renderer.render(scene, camera);
}
renderer.setAnimationLoop(frame);

// test hooks (QA only)
window.__fl = {
  letters, clock, stats, look, pokeAt,
  get held() { return !!drag.L; },
  get words() { return words; },
  advance(sec, h = 1 / 60) { for (let s = 0; s < sec - 1e-6; s += h) { clock.t += h; stepAll(clock.t, h); stepRipples(h); } blobUniforms.uT.value = bubbleUniforms.uT.value = clock.t; },
  setLook(yawDeg, pitchDeg) { look.tYaw = look.yaw = THREE.MathUtils.degToRad(yawDeg); look.tPitch = look.pitch = THREE.MathUtils.degToRad(pitchDeg); },
  screenPos(L = letters[0]) { const v = L.pos.clone().project(camera); return { x: (v.x + 1) / 2 * innerWidth, y: (1 - v.y) / 2 * innerHeight, front: v.z < 1 }; },
  vr: {
    state: vr, VR_M, world, panel, replayBtn, resetGame,
    get won() { return won; },
    side(name) { return vr.hands.findIndex(H => H.side === name); },
    ray(i) { const H = vr.hands[i]; const o = H.ctrl.getWorldPosition(new THREE.Vector3()), d = new THREE.Vector3(0, 0, -1).applyQuaternion(H.ctrl.getWorldQuaternion(new THREE.Quaternion())); return { o: o.toArray(), d: d.toArray(), visible: H.line.visible }; },
    // put a letter at a point in scene metres, at rest
    placeScene(ch, x, y, z) { const L = letters.find(l => l.ch === ch); L.pos.copy(toLocal(new THREE.Vector3(x, y, z))); L.vel.set(0, 0, 0); L.angVel.set(0, 0, 0); L.mesh.quaternion.copy(vr.headQ); L.releaseAt = clock.t; },
    replayPos() { return replayBtn.getWorldPosition(new THREE.Vector3()).toArray(); },
    tip(i) { const j = vr.hands[i].hand.joints['index-finger-tip']; return j ? j.getWorldPosition(new THREE.Vector3()).toArray() : null; },
    hand(i) { const H = vr.hands[i]; return { kind: H.kind, side: H.side, tracked: H.tracked, pinch: H.pinch, held: H.held ? H.held.ch : null, aimed: H.aimed ? H.aimed.ch : null, aimBtn: H.aimBtn, pt: H.pt.toArray(), vel: H.vel.toArray() }; },
    letterScene(ch) { const L = letters.find(l => l.ch === ch); return toScene(L, new THREE.Vector3()).toArray(); },
    letterInfo(ch) { const L = letters.find(l => l.ch === ch); return { scene: toScene(L, new THREE.Vector3()).toArray(), velMs: L.vel.length() * world.scale.x, dragged: L.dragged, spin: L.angVel.length() }; },
    // put a letter at a point given in HEAD space (metres), facing you, at rest
    placeInHead(ch, x, y, z) {
      const L = letters.find(l => l.ch === ch);
      const p = new THREE.Vector3(x, y, z).applyQuaternion(vr.headQ).add(vr.head);
      L.pos.copy(toLocal(p)); L.vel.set(0, 0, 0); L.angVel.set(0, 0, 0); L.mesh.quaternion.copy(vr.headQ); L.dragged = false; L.releaseAt = clock.t;
      return p.toArray();
    },
    headPose() { return { p: vr.head.toArray(), q: vr.headQ.toArray() }; }
  },
  info() { const L = letters[0]; return { pos: L.pos.toArray().map(n => +n.toFixed(2)), vel: +L.vel.length().toFixed(3), spin: +L.angVel.length().toFixed(3), held: L.dragged, quality: stats.quality, t: +clock.t.toFixed(2) }; }
};
