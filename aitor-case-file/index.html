<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AItor Case File</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://rsms.me/inter/inter.css">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#151515; --card:#222; --edge:#2f2f2f; --ink:#fff; --soft:#cfcfcf; --muted:#9a9a9a; --green:#3ddc84;
  --sans:"Inter","InterVariable",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --pixel:"Press Start 2P","Courier New",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:22px;line-height:1.45;font-feature-settings:"cv08" 1}
/* cv08 = Inter's serifed capital I, so "AItor" never reads as "Altor" */
button{font:inherit;color:inherit;cursor:pointer}
img{image-rendering:pixelated}

/* ---------- top bar: Neuron progress left, mission chips right, calm timer line at the bottom ---------- */
.top{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 24px 12px;background:var(--bg);z-index:5}
.who{display:flex;align-items:center;gap:12px;min-width:0}
.who img{height:64px;width:48px;object-fit:cover;object-position:top;border-radius:10px;flex:none}
.who .t{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand{color:var(--muted);font-size:20px;font-weight:600;white-space:nowrap}
.brand span{color:#666;font-weight:400;margin-left:10px}
.free{font-size:18px;color:var(--soft)}
.free b{color:var(--green)}
.demo{display:inline-block;padding:2px 10px;border-radius:999px;background:#3a3112;color:#ffd866;font-size:15px;font-weight:600;width:max-content}
.demo[hidden]{display:none}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.chips{display:flex;gap:8px;flex-wrap:nowrap;justify-content:flex-end}
.chip{border:1px solid var(--edge);border-radius:999px;padding:6px 14px;color:#8a8a8a;display:flex;align-items:center;gap:8px;font-size:19px;transition:all .4s;white-space:nowrap}
.chip .n{font-size:20px}
.chip .lab{font-family:var(--pixel);font-size:11px}
.chip .kw{color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis}
.chips .chip{max-width:300px}
.chip.lit{border-color:var(--green);color:var(--green);background:rgba(61,220,132,.10)}
.chip.flick{border:1px dashed var(--green);color:var(--green);animation:flick 1.4s ease-in-out infinite}
@keyframes flick{0%,100%{opacity:.35}50%{opacity:.9}}
.chip.pop{animation:pop .8s}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.15)}100%{transform:scale(1)}}
.chips .chip{cursor:pointer}
.missionbtn{border:1px solid #555;background:#2a2a2a;color:var(--ink);border-radius:999px;padding:6px 16px;font-weight:700;font-size:17px;letter-spacing:.08em;white-space:nowrap}
.chiprow{display:flex;gap:8px;align-items:center;flex-wrap:nowrap;justify-content:flex-end}
#missionOv .obj{font-size:22px}
#missionOv .obj img{width:60px;height:80px}
.mlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;width:100%;text-align:left}
.mlist li{border:1px solid var(--edge);border-radius:14px;padding:10px 16px;font-size:22px;font-weight:600;background:#1b1b1b}
.mlist li span{color:var(--muted);margin-right:8px;font-weight:400}
.mlist li.got{border-color:var(--green);color:var(--green)}
.mlist li em{display:block;font-style:normal;font-weight:400;font-size:19px;color:var(--ink)}
.donebtn{border:1px solid var(--green);background:var(--green);color:#0b1a10;border-radius:999px;padding:6px 18px;font-weight:700;font-size:18px;white-space:nowrap;box-shadow:0 0 0 5px rgba(61,220,132,.15)}
.donebtn[hidden]{display:none}
.timer{position:absolute;left:0;right:0;bottom:0;height:3px;background:#1f1f1f}
.timer i{display:block;height:100%;width:0;background:#4f7f63;transition:width 1s linear}

/* ---------- home: Neuron's line + the 2 mission questions + search ---------- */
.home{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:110px 16px 40px;text-align:center}
.obj{display:flex;align-items:center;gap:16px;max-width:820px;text-align:left;font-size:26px;color:var(--soft);margin:0}
.obj img{width:84px;height:112px;object-fit:cover;object-position:top;border-radius:14px;flex:none}
.obj b{color:var(--ink)}
.mission{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;width:min(760px,100%);text-align:left}
.mission li{background:var(--card);border:1px solid var(--edge);border-radius:14px;padding:12px 18px;font-size:24px;font-weight:600}
.mission li span{color:var(--muted);margin-right:10px;font-weight:400}
.method{color:var(--muted);font-size:20px}
.method b{color:var(--soft);font-weight:600}
#homeSlot{width:min(760px,100%);display:flex;flex-direction:column;align-items:center;gap:10px}
.started .home{display:none}

form.search{display:flex;align-items:center;gap:8px;width:min(760px,100%);background:var(--card);border:1px solid var(--edge);border-radius:999px;padding:8px 8px 8px 26px}
form.search input{flex:1;min-width:0;background:transparent;border:0;color:var(--ink);font:inherit;font-size:24px;padding:12px 0;outline:none}
form.search button{background:#fff;color:#111;border:0;border-radius:999px;padding:12px 26px;font-weight:700;font-size:22px}
form.search button:disabled,form.search input:disabled{opacity:.4}
form.search:focus-within{border-color:#555}
.note{color:#9a9a9a;font-size:20px;min-height:1.4em;text-align:center}
.dock{display:none}
.started .dock{display:flex;flex-direction:column;align-items:center;gap:6px;position:fixed;left:0;right:0;bottom:0;padding:16px 16px 18px;background:linear-gradient(transparent,var(--bg) 35%);z-index:5}

/* ---------- canvas: one card per turn, flowing left -> right ---------- */
.canvas{display:none;position:relative;overflow-x:auto;padding:120px 60px 220px;gap:120px;align-items:flex-start;min-height:100vh}
.started .canvas{display:flex}
.col{flex:none;width:520px;display:flex;flex-direction:column;gap:14px;position:relative;z-index:1}
.card{background:var(--card);border:1px solid var(--edge);border-radius:16px;padding:22px 24px 36px;position:relative}
.card h2{margin:0 0 8px;font-size:26px;line-height:1.3;font-weight:700}
.lights{display:flex;gap:14px;margin:0 0 12px;font-size:15px;font-weight:600;letter-spacing:.06em;color:#6a6a6a}
.lights span{display:flex;align-items:center;gap:6px}
.lights span::before{content:"";width:11px;height:11px;border-radius:50%;background:#3a3a3a}
.lights span.on{color:var(--green)}
.lights span.on::before{background:var(--green);box-shadow:0 0 8px rgba(61,220,132,.7)}
.card ul{margin:0;padding:0;list-style:none}
.card li{color:var(--soft);font-size:23px;margin:8px 0;padding-left:20px;position:relative}
.card li::before{content:"";position:absolute;left:2px;top:.62em;width:7px;height:7px;border-radius:50%;background:#777}
.card li b{color:var(--ink)}
.pill{position:absolute;left:50%;bottom:-21px;transform:translateX(-50%);background:#fff;color:#111;border:0;border-radius:999px;padding:9px 22px;font-size:19px;font-weight:700;white-space:nowrap}
.tipline{display:flex;align-items:center;gap:10px;color:var(--soft);font-size:21px;margin-top:20px}
.tipline img{height:46px;width:auto;flex:none}
.follow{display:flex;flex-direction:column;gap:10px;padding-left:28px}
.follow .lbl{font-size:15px;color:#777;letter-spacing:.06em;font-weight:600}
.fu{background:var(--card);border:1px solid var(--edge);border-radius:14px;padding:10px 16px;text-align:left}
.fu b{display:block;font-size:21px;font-weight:600}
.fu span{display:block;font-size:19px;color:var(--muted)}
.fu.sel{border-color:var(--green);box-shadow:0 0 0 1px var(--green) inset}
.fu:disabled{cursor:default}
@media (min-width:761px){
  .col{width:auto;display:grid;grid-template-columns:520px 300px;column-gap:28px;row-gap:0;align-items:start}
  .col>.card{grid-column:1;grid-row:1}
  .col>.tipline{grid-column:1;grid-row:2;margin-top:30px}
  .col>.follow{grid-column:2;grid-row:1;align-self:center;padding-left:0}
}
.wires{position:absolute;left:0;top:0;pointer-events:none;z-index:0;overflow:visible}
.wires path{stroke:var(--green);stroke-width:2;fill:none}

.load{display:flex;gap:16px;align-items:center}
.load img{width:96px;height:auto;border-radius:12px;background:#fff;flex:none}
.bars{flex:1;display:flex;flex-direction:column;gap:12px}
.sk{height:16px;border-radius:8px;background:linear-gradient(90deg,#2c2c2c 0%,#3a3a3a 50%,#2c2c2c 100%);background-size:200% 100%;animation:sh 1.2s linear infinite}
@keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}
.slow{color:var(--muted);font-size:19px;margin-top:12px;min-height:1.2em}

/* ---------- overlays: win (tap only), time's-up reveal, mentor menu ---------- */
.ov{position:fixed;inset:0;background:rgba(10,10,10,.9);display:none;padding:20px;z-index:10;overflow:auto}
.ov.show{display:flex}
.box{margin:auto;background:var(--card);border:1px solid var(--edge);border-radius:20px;padding:24px 30px;width:min(680px,100%);display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
.box h2{margin:0;font-size:28px;letter-spacing:.04em}
.box .hero{width:96px;height:auto;border-radius:16px}
.wchips{display:flex;flex-direction:column;gap:8px;width:100%}
.wchips .chip{justify-content:space-between;font-size:22px;padding:10px 18px;white-space:normal}
.rv{width:100%;display:flex;flex-direction:column;gap:10px;text-align:left}
.rv div{background:#1b1b1b;border:1px solid var(--edge);border-radius:14px;padding:12px 16px;font-size:22px;color:var(--soft)}
.rv div.got{border-color:var(--green)}
.rv .rn{font-family:var(--sans);font-size:20px;vertical-align:middle}
.rv b{display:block;font-family:var(--pixel);font-size:12px;color:var(--green);margin-bottom:6px;font-weight:400}
.box p{margin:0}
.back{font-size:24px;font-weight:700}
.score b{font-size:30px}
.wmove{font-size:34px;line-height:1.25;font-weight:800;color:var(--green);margin:4px 0 0}
.wmove small{display:block;font-size:20px;font-weight:600;color:var(--soft)}
.wtrick{font-size:22px;color:var(--soft)}
.rv div.move{border-color:var(--green)}
.rv .big{display:block;font-size:30px;line-height:1.25;font-weight:800;color:var(--green)}
.rv div.move.none .big{color:var(--soft);font-size:26px}
.muted{color:var(--muted)}
.btn{background:#fff;color:#111;border:0;border-radius:999px;padding:12px 28px;font-weight:700;font-size:21px}
.tm{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;width:100%;text-align:left}
.tm h3{grid-column:1/-1;margin:8px 0 0;font-size:16px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.08em}
.tm button{background:#2a2a2a;border:1px solid var(--edge);border-radius:12px;padding:10px 12px;font-size:19px;text-align:left}

/* ---------- EN | LT language pill (fixed, top centre; top-right on phones) ---------- */
.lang{position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:20;display:flex;border:1px solid #555;border-radius:999px;background:#1d1d1d;overflow:hidden}
.lang button{border:0;background:transparent;color:var(--muted);font-weight:700;font-size:17px;letter-spacing:.06em;min-width:52px;min-height:44px;padding:0 14px}
.lang button.on{background:var(--ink);color:#111}

@media (max-width:760px){
  .top{flex-direction:column;align-items:flex-start;gap:8px;padding:10px 16px 12px;border-bottom:1px solid #222}
  .lang{left:auto;right:12px;transform:none;top:10px}
  .lang button{min-width:48px;padding:0 10px}
  .who{padding-right:116px}
  .brand{white-space:normal}
  .demo{width:auto;white-space:normal;border-radius:10px}
  .lights{flex-wrap:wrap;row-gap:4px}
  .right{align-items:flex-start}
  .chips{flex-wrap:wrap;justify-content:flex-start}
  .chiprow{flex-wrap:wrap;justify-content:flex-start}
  .obj{font-size:23px}
  .mission li{font-size:22px}
  .canvas{flex-direction:column;align-items:stretch;gap:56px;padding:260px 16px 220px;overflow-x:visible}
  .col{width:100%}
  .follow{padding-left:0}
  .wires{display:none}
  .col+.col::before{content:"";position:absolute;left:50%;top:-50px;width:2px;height:40px;background:var(--green)}
  form.search{padding-left:18px}
  form.search button{padding:12px 18px}
}
</style>
</head>
<body>
<div class="lang" id="langPill" role="group" aria-label="Language / Kalba"><button type="button" data-lang="en" lang="en">EN</button><button type="button" data-lang="lt" lang="lt">LT</button></div>
<div id="app">
  <div class="top">
    <div class="who">
      <img id="neuronImg" class="a-stuck" src="assets/neuron_stuck.gif" alt="Neuron stuck in the slop">
      <div class="t">
        <div class="brand">AItor Case File<span id="count"></span></div>
        <div class="free" id="free"></div>
        <div class="demo" id="demo" hidden>DEMO MODE — pre-written answers, not the real AI</div>
      </div>
    </div>
    <div class="right">
      <div class="chiprow"><button type="button" class="missionbtn" id="missionBtn">MISSION</button><div class="chips" id="slots"></div></div>
      <button type="button" class="donebtn" id="doneBtn" hidden>CASE FILE COMPLETE — see it</button>
    </div>
    <div class="timer" aria-hidden="true"><i id="timerBar"></i></div>
  </div>

  <section class="home">
    <p class="obj"><img class="a-stuck" src="assets/neuron_stuck.gif" alt="Neuron stuck in the slop"><span><b class="t-neuron">Neuron:</b> <span id="objective"></span></span></p>
    <ol class="mission" id="mission"></ol>
    <div class="method" id="method">Good prompts light 3 lights: <b>TASK</b> · <b>CONTEXT</b> · <b>OUTCOME</b></div>
    <div id="homeSlot"></div>
  </section>

  <div class="canvas" id="canvas"></div>

  <div class="dock" id="dock"></div>

  <!-- the one search box: lives on the home screen, then docks at the bottom -->
  <form class="search" id="ask" autocomplete="off">
    <input id="q" name="q" type="text" maxlength="300" placeholder="Ask AItor..." enterkeyhint="send" aria-label="Your prompt for AItor">
    <button id="go" type="submit">Ask</button>
  </form>
  <div class="note" id="ctx"></div>
</div>

<!-- win (opens only when the kid taps the green pill) -->
<div class="ov" id="winOv">
  <div class="box">
    <img class="hero" id="heroImg" src="assets/neuron_backflip.png" alt="Neuron backflips out of the slop">
    <h2 id="winTitle"></h2>
    <p class="wtrick" id="winTrick"></p>
    <p class="wmove" id="winMove"></p>
    <p class="score" id="winScore">It took you <b id="winCount">0</b> prompts.</p>
    <p id="winNote"></p>
    <p class="muted" id="winBonus"></p>
    <p class="back" id="winBack"></p>
    <button class="btn" id="keepBtn" type="button">Keep asking</button>
  </div>
</div>

<!-- mission card: always reachable (MISSION pill or any chip); closes on any tap -->
<div class="ov" id="missionOv">
  <div class="box">
    <p class="obj"><img class="a-stuck" src="assets/neuron_stuck.gif" alt="Neuron stuck in the slop"><span><b class="t-neuron">Neuron:</b> <span id="missionLine"></span></span></p>
    <ol class="mlist" id="missionList"></ol>
    <p class="muted" id="missionTip"></p>
    <button class="btn" id="missionClose" type="button">Close</button>
  </div>
</div>

<!-- time's up: reveal both answers -->
<div class="ov" id="revealOv">
  <div class="box">
    <h2 id="revealTitle"></h2>
    <div class="rv" id="revealList"></div>
    <p class="back" id="revealBack"></p>
  </div>
</div>

<!-- mentor test menu (type "test") -->
<div class="ov" id="testOv">
  <div class="box">
    <h2>Mentor test menu</h2>
    <div class="tm" id="tm"></div>
    <button class="btn" id="tmClose" type="button">Close</button>
  </div>
</div>

<script src="config.js"></script>
<script>
(() => {
"use strict";
/* ---------- language: EN (config above) or LT (CASE_CONFIG_LT overrides) ---------- */
const UI_EN = {
  demo: "DEMO MODE — pre-written answers, not the real AI", mission: "MISSION", done: "CASE FILE COMPLETE — see it", neuron: "Neuron:",
  method: "Good prompts light 3 lights:", lights: { task: "TASK", context: "CONTEXT", outcome: "OUTCOME" },
  placeholder: "Ask AItor...", inputLabel: "Your prompt for AItor", ask: "Ask", tookYou: null, keepAsking: "Keep asking", close: "Close",
  promptOne: "prompt", promptFew: "prompts", promptMany: "prompts", free: null, followUp: "Ask Follow Up", goDeeper: "GO DEEPER",
  goingDeeper: "Going deeper: {title} — now type your prompt.", askAbout: "Ask about: ", timesUp: "Time's up", yourMove: "Your counter-move:",
  oneAtATime: "One prompt at a time — wait a second...", needsRest: "AItor needs a rest. Ask your mentor to restart the case file.",
  slow: "Still guessing... hold on.", fuzzy: "AItor's signal got fuzzy. Not yet — try asking again!", fuzzyTip: "Ask again in a few seconds.",
  altStuck: "Neuron stuck in the slop", altBackflip: "Neuron backflips out of the slop", altShake: "Neuron shakes AItor", altAitor: null,
};
const BASE = window.CASE_CONFIG, LTC = window.CASE_CONFIG_LT || {};
function buildLT() {
  const o = Object.assign({}, BASE, LTC);
  o.slots = BASE.slots.map((s, i) => { const l = (LTC.slots || [])[i] || {}; return Object.assign({}, s, l, { keywords: s.keywords, keywordsLt: l.keywords || [] }); });
  o.tcoTips = Object.assign({}, BASE.tcoTips, LTC.tcoTips);
  o.nudges = Object.assign({}, BASE.nudges, LTC.nudges, { soft: Object.assign({}, BASE.nudges.soft, (LTC.nudges || {}).soft) });
  o.reveal = Object.assign({}, BASE.reveal, LTC.reveal); o.win = Object.assign({}, BASE.win, LTC.win);
  o.ui = Object.assign({}, UI_EN, LTC.ui, { lights: Object.assign({}, UI_EN.lights, (LTC.ui || {}).lights) });
  o.kwLabels = LTC.kwLabels || {};
  return o;
}
const CFG = { en: Object.assign({}, BASE, { ui: UI_EN, kwLabels: {} }), lt: buildLT() };
const params = new URLSearchParams(location.search);
function storedLang() { try { return localStorage.getItem("aitorLang"); } catch (e) { return null; } }
let LANG = (params.get("lang") || storedLang() || "en").toLowerCase() === "lt" ? "lt" : "en";
let C = CFG[LANG];
const U = () => C.ui;
const MOCK = params.get("mock") === "1" || !C.anonKey;   // no key yet -> offline mock
const $ = (id) => document.getElementById(id);
const IDS = C.slots.map((s) => s.id);

const S = {
  found: {}, flicker: {}, prompts: 0, sinceNew: 0,
  turns: [],            // [{q, from:{turn,i}|null, r:reply|null}]
  branch: null,         // {turn, i} tapped on the latest card
  history: [], busy: false, lastSend: 0, slowNext: false, won: false,
  timerEnd: 0, warned: false, timeUp: false, lastRender: 0,
  sessionId: (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2)),
};

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const poseSrc = (p) => p === "shrug" ? "assets/aitor_shrug_sm.png" : "assets/aitor_point_sm.png";
const moveText = () => S.found.counter || C.counterMoveFallback;
const cleanMove = (m) => String(m || "").replace(/["\n]/g, " ").trim().split(/\s+/).filter(Boolean).slice(0, 6).join(" ").slice(0, 40).replace(/[.!\s]+$/, "");
const nFound = () => IDS.filter((id) => S.found[id]).length;

/* ---------- static text (re-run on every EN | LT switch) ---------- */
const promptWord = (n) => { const u = U(); if (LANG !== "lt") return n === 1 ? u.promptOne : u.promptMany;
  const t = n % 10, h = n % 100; return (t === 1 && h !== 11) ? u.promptOne : (t >= 2 && (h < 10 || h > 20)) ? u.promptFew : u.promptMany; };
function applyStatic() {
  const u = U();
  document.documentElement.lang = LANG;
  document.querySelectorAll("#langPill button").forEach((b) => { const on = b.dataset.lang === LANG; b.classList.toggle("on", on); b.setAttribute("aria-pressed", on); });
  $("objective").textContent = C.objective;
  $("mission").innerHTML = C.slots.map((s) => `<li><span>${s.num}</span>${esc(s.question)}</li>`).join("");
  $("method").innerHTML = `${esc(u.method)} <b>${esc(u.lights.task)}</b> · <b>${esc(u.lights.context)}</b> · <b>${esc(u.lights.outcome)}</b>`;
  $("winTitle").textContent = C.win.title;
  $("winNote").textContent = C.win.notebook;
  $("winBonus").textContent = C.win.bonus;
  $("winBack").textContent = C.endMessage;
  $("revealTitle").textContent = C.reveal.title;
  $("missionLine").textContent = C.objective;
  $("missionTip").textContent = C.missionReminder;
  $("revealBack").textContent = C.endMessage;
  $("demo").textContent = u.demo;
  $("missionBtn").textContent = u.mission;
  $("doneBtn").textContent = u.done;
  document.querySelectorAll(".t-neuron").forEach((b) => { b.textContent = u.neuron; });
  document.querySelectorAll(".a-stuck").forEach((i) => { i.alt = u.altStuck; });
  $("heroImg").alt = u.altBackflip;
  $("go").textContent = u.ask;
  $("q").setAttribute("aria-label", u.inputLabel);

    if (!topic && branch && /(tai|apie tai|daugiau|plačiau)/i.test(q)) topic = ["counter", "trick"].find((t) => M.topic[t].test(branch.title + " " + branch.teaser)) || null;
    if (topic === "counter" && L >= 3) {
      const c = findC();
      if (c) { points = c[3]; move = c[2]; interest = c[1]; usesInterest = true; }
      else points = M.general.counter;
    }
    else if (topic) points = (L >= 3 ? M.full : L === 2 ? M.half : M.general)[topic];
  }
  if (!points) { const w = (q.toLowerCase().replace(/brain ?rot/g, "").match(/[\p{L}']+/gu) || []).filter((x) => x.length > 2 && !M.stop.has(x)).pop() || "tai"; points = [{ lead: "Spėju.", text: M.guess(w) }]; }
  const askedBreakFree = M.topic.counter.test(q);
  if (!interest) { const c = findC(); if (c) interest = c[1]; }
  driftI++;
  const other = M.deeper.other, br = topic ? M.deeper[topic] : [other[driftI % 4], other[(driftI + 1) % 4]];
  return {
    status: "ok", points, answer: points.map((p) => p.lead + " " + p.text).join(" "),
    branches: br, tco, lights: L,
    tip: tcoTip(tco, n, askedBreakFree && !interest), pose: L <= 1 ? "shrug" : "point",
    slots_explained: topic && L >= 2 && !(topic === "counter" && L >= 3 && !usesInterest) ? [topic] : [],
    counter_move: move, interest, uses_interest: usesInterest,
  };
}

/* ---------- live call ---------- */
async function liveReply(q, branch) {
  const res = await fetch(C.endpoint, {
    method: "POST",
    headers: { "Content-Type": "application/json", apikey: C.anonKey, Authorization: "Bearer " + C.anonKey },
    body: JSON.stringify({ prompt: q, sessionId: S.sessionId, found: Object.keys(S.found), branch, history: S.history.slice(-2), n: S.prompts, lang: LANG }),
  });
  return res.json();
}
const fuzzy = () => ({ status: "error", answer: U().fuzzy, branches: [], tip: { kind: "none", text: U().fuzzyTip }, pose: "shrug", lit: [], flicker: [] });

/* ---------- 12-minute timer: calm bar, one gentle warning, then reveal ---------- */
function startTimer() { if (!S.timerEnd) S.timerEnd = Date.now() + C.timerMinutes * 60000; }
function tick() {
  if (!S.timerEnd || S.timeUp || S.won) return;
  const total = C.timerMinutes * 60000, left = S.timerEnd - Date.now();
  $("timerBar").style.width = Math.min(100, Math.max(0, (1 - left / total) * 100)) + "%";
  if (!S.warned && left <= C.warnAtMinutes * 60000 && left > 0) { S.warned = true; $("ctx").textContent = C.warnText; }
  if (left <= 0) timeUp();
}
setInterval(tick, 1000);
function timeUp() {
  S.timeUp = true;
  $("timerBar").style.width = "100%";
  $("q").disabled = true; $("go").disabled = true; $("q").placeholder = U().timesUp;
  // never cover an answer the kid has not had time to read
  const wait = S.busy ? 400 : Math.max(0, 6000 - (Date.now() - S.lastRender));
  const show = () => { if (S.busy) return setTimeout(show, 400); render(); showReveal(); };
  setTimeout(show, wait);
}
function showReveal() {
  const [t, c] = C.slots;
  $("revealList").innerHTML = `<div class="${S.found[t.id] ? "got" : ""}"><b><span class="rn">${t.num}</span> ${esc(t.label)}${S.found[t.id] ? " \u2713" : ""}</b>${esc(t.reveal)}</div>`
    + `<div class="move${S.found[c.id] ? "" : " none"}"><b><span class="rn">${c.num}</span> ${esc(c.label)}${S.found[c.id] ? " \u2713" : ""}</b><span class="big">${esc(U().yourMove)} ${esc(moveText())}</span></div>`;
  $("winOv").classList.remove("show");
  $("revealOv").classList.add("show");
}

/* ---------- main loop ---------- */
function openTest() { $("testOv").classList.add("show"); }
function scrollToTurn(k) {
  const col = $("col-" + k); if (!col) return;
  if (innerWidth > 760) { const cv = $("canvas"); cv.scrollTo({ left: Math.max(0, col.offsetLeft - 60), behavior: "smooth" }); }
  else {
    const topH = document.querySelector(".top").offsetHeight;
    window.scrollTo({ top: col.getBoundingClientRect().top + scrollY - topH - 12, behavior: "smooth" });
  }
}
async function submit(e) {
  if (e) e.preventDefault();
  const q = ($("q").value || "").trim();          // read value at submit (Quest keyboard fires no key events)
  if (!q || S.busy) return;
  if (/^t-?e-?s-?t$/i.test(q)) { $("q").value = ""; openTest(); return; }
  if (S.timeUp) return;
  if (C.clientMinGapMs - (Date.now() - S.lastSend) > 0) { $("ctx").textContent = U().oneAtATime; return; }
  if (S.prompts >= C.sessionCap) { $("ctx").textContent = U().needsRest; return; }

  S.busy = true; S.lastSend = Date.now();
  startTimer();
  $("q").value = ""; $("go").disabled = true; $("q").placeholder = U().placeholder;
  start();
  const from = S.branch && S.branch.turn === S.turns.length - 1 ? S.branch : null;
  const branchObj = from ? S.turns[from.turn].r.branches[from.i] : null;
  S.branch = null;
  S.turns.push({ q, from, r: null });
  const k = S.turns.length - 1;
  render(); scrollToTurn(k);
  if (!S.warned) $("ctx").textContent = "";
  const slowT = setTimeout(() => { const el = $("slow"); if (el) el.textContent = U().slow; }, C.slowReplyMs);

  let r;
  try {
    if (MOCK) {
      const delay = S.slowNext ? C.slowReplyMs + 2500 : 900 + Math.random() * 700;
      S.slowNext = false;
      await new Promise((ok) => setTimeout(ok, delay));
      r = mockReply(q, branchObj, S.prompts);
      const kw = keywordHits(r.answer);
      const agreed = r.slots_explained.filter((id) => kw[id]);   // model AND keyword check (as on server)
      r.lit = r.lights === 3 ? agreed : [];
      r.flicker = r.lights === 2 ? agreed : [];
    } else {
      r = await liveReply(q, branchObj);
    }
  } catch (err) { r = fuzzy(); }
  clearTimeout(slowT);
  if (!r || typeof r.answer !== "string") r = fuzzy();

  if (r.status === "ok") S.prompts++;
  S.history.push({ q, a: r.answer }); S.history = S.history.slice(-3);

  const kw = keywordHits(r.answer);
  let newId = null;
  for (const id of (r.lit || [])) if (!S.found[id]) {
    S.found[id] = id === "counter" ? (cleanMove(r.counter_move) || niceKw(kw[id] || "my own move")) : niceKw(kw[id] || id);
    newId = id;
  }
  S.flicker = {};
  for (const id of (r.flicker || [])) if (!S.found[id]) S.flicker[id] = true;
  if (Object.keys(S.flicker).length && r.tip) r.tip = { kind: r.tip.kind, text: C.flickerNote + " " + r.tip.text };

  // nudge only when the prompt was already great (3 lights) but missed every open question
  const missing = IDS.filter((id) => !S.found[id]);
  if (r.status === "ok" && r.lights === 3) S.sinceNew = newId ? 0 : S.sinceNew + 1;
  if (newId) S.sinceNew = 0;
  if (missing.length && S.sinceNew >= C.nudges.after) { r.tip = { kind: "nudge", text: C.nudges.soft[missing[0]] }; r.pose = "point"; }

  S.turns[k].r = r;
  if (!missing.length && !S.won) { S.won = true; $("doneBtn").hidden = false; }   // never auto-cover: kid taps to open
  render(); renderSlots(newId); scrollToTurn(k);
  S.lastRender = Date.now();
  S.busy = false; if (!S.timeUp) $("go").disabled = false;
}
function showWin() {
  renderSlots();
  $("winScore").innerHTML = U().tookYou ? `${esc(U().tookYou)} <b id="winCount">${S.prompts}</b>` : `It took you <b id="winCount">${S.prompts}</b> prompts.`;
  $("winTrick").innerHTML = `<b>\u2460</b> ${esc(C.slots[0].reveal)}`;
  $("winMove").innerHTML = `<small>${esc(U().yourMove)}</small>${esc(moveText())}`;
  $("winOv").classList.add("show");
}

$("ask").addEventListener("submit", submit);
$("doneBtn").addEventListener("click", showWin);
function showMission() {
  $("missionList").innerHTML = C.slots.map((s) => S.found[s.id]
    ? `<li class="got"><span>${s.num}</span>${esc(s.question)} \u2713<em>${esc(s.label)}: ${esc(S.found[s.id])}</em></li>`
    : `<li><span>${s.num}</span>${esc(s.question)}</li>`).join("");
  $("missionOv").classList.add("show");
}
$("missionBtn").addEventListener("click", showMission);
$("slots").addEventListener("click", (e) => { if (e.target.closest(".chip")) showMission(); });
$("missionOv").addEventListener("click", () => $("missionOv").classList.remove("show"));   // any tap closes
$("demo").hidden = !MOCK;
$("keepBtn").addEventListener("click", () => { $("winOv").classList.remove("show"); $("q").focus(); });
$("tmClose").addEventListener("click", () => $("testOv").classList.remove("show"));

/* ---------- mentor test menu ---------- */
function fakeTurn(q, r) { start(); S.turns.push({ q, from: null, r }); render(); scrollToTurn(S.turns.length - 1); S.lastRender = Date.now(); }
const closeTM = () => $("testOv").classList.remove("show");
const T3 = { task: true, context: true, outcome: true };
const TM = [
  ["Questions", null],
  ...C.slots.map((s) => ["Lock " + s.num + " " + s.label, () => { S.found[s.id] = s.testMove || niceKw(s.keywords[0]); delete S.flicker[s.id]; if (nFound() === IDS.length) { S.won = true; $("doneBtn").hidden = false; } renderSlots(s.id); }]),
  ["Flicker ① (2 lights)", () => { S.flicker = { trick: true }; renderSlots(); }],
  ["Reset case file", () => { S.found = {}; S.flicker = {}; S.prompts = 0; S.sinceNew = 0; S.won = false; S.turns = []; S.history = []; S.branch = null; S.timerEnd = 0; S.warned = false; S.timeUp = false;
    $("timerBar").style.width = "0"; $("q").disabled = false; $("go").disabled = false; $("q").placeholder = U().placeholder; $("ctx").textContent = "";
    $("doneBtn").hidden = true; $("revealOv").classList.remove("show"); render(); renderSlots(); document.body.classList.remove("started"); placeSearch(); }],
  ["Jump", null],
  ["Win screen", () => { S.won = true; closeTM(); showWin(); }],
  ["Jump timer to 0:10", () => { closeTM(); S.timeUp = false; S.timerEnd = Date.now() + 10000; tick(); }],
  ["Show reveal", () => { closeTM(); showReveal(); }],
  ["Slow next reply", () => { S.slowNext = true; closeTM(); $("ctx").textContent = "(test) next reply will be slow"; }],
  ["Loading card", () => { closeTM(); fakeTurn("(test) loading card", null); }],
  ["Nudge", () => { closeTM(); fakeTurn("(test) nudge", { points: [{ lead: "", text: "(test answer)" }], branches: [], tco: T3, tip: { text: C.nudges.soft.counter }, pose: "point" }); }],
  ["Tips + poses", null],
  ...[["missing TASK", { task: false, context: false, outcome: false }], ["missing CONTEXT", { task: true, context: false, outcome: false }],
      ["missing OUTCOME", { task: true, context: true, outcome: false }], ["all 3 lights", T3], ["missing interest", T3, true]].map(([label, t, mi]) => ["Tip: " + label, () => {
    closeTM(); const L = lightCount(t);
    fakeTurn("(test) tip: " + label, { points: [{ lead: "Test.", text: "This is how this tip looks." }], branches: DEEPER.trick, tco: t, tip: tcoTip(t, 0, mi), pose: L <= 1 ? "shrug" : "point" });
  }]),
];
$("tm").innerHTML = TM.map(([label, fn], i) => fn ? `<button type="button" data-i="${i}">${esc(label)}</button>` : `<h3>${esc(label)}</h3>`).join("")
  + `<h3>Mode: ${MOCK ? "mock (offline)" : "live (server)"}</h3>`;
$("tm").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) TM[+b.dataset.i][1](); });

/* ---------- first screen: Neuron's line + 2 questions + search ---------- */
applyStatic(); placeSearch(); renderSlots();
window.__case = S; // for testing
})();
</script>
