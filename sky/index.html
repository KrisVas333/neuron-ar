<script>
// beta gate (2026-11-12): the Brain Puzzle's gate, copied. Keeps kids out of the test build. Client-side only, not real security.
// Same password and the same remembered flag (bp-beta-ok) as the puzzle, so a tester who opened one is not asked again on the same site.
// The puzzle compares the plain word; this file holds only its SHA-256, so the word itself is written nowhere here.
(function () {
  var HASH = '559aead08264d5795d3909718cdd05abd49572e84fe55590eef31a88a08fdffd', KEY = 'bp-beta-ok', LANG_KEY = 'living-sky-lang';
  var WORDS = { en: { h: 'Password', go: 'Go', wrong: 'Wrong password' }, lt: { h: 'Slaptažodis', go: 'Eiti', wrong: 'Neteisingas slaptažodis' } };
  var $ = function (id) { return document.getElementById(id); };
  var gate = $('gate'), pw = $('gatepw'), msg = $('gatemsg'), lang = 'en', wrong = false;
  function sha256(s) {          // plain SHA-256, hex (no crypto.subtle: that needs https, and the gate must also work on a local http server)
    var b = new TextEncoder().encode(s), K = [], H = [], fr = function (x) { return (x - Math.floor(x)) * 4294967296 | 0; }, n, c, i, o, p;
    for (n = 2, c = 0; c < 64; n++) { p = true; for (i = 2; i * i <= n; i++) if (n % i === 0) { p = false; break; } if (p) { if (c < 8) H[c] = fr(Math.sqrt(n)); K[c++] = fr(Math.cbrt(n)); } }
    var L = b.length, m = new Uint8Array((L + 72) & ~63), dv = new DataView(m.buffer), w = new Int32Array(64), r = function (x, k) { return (x >>> k) | (x << (32 - k)); };
    m.set(b); m[L] = 128; dv.setUint32(m.length - 4, L * 8); dv.setUint32(m.length - 8, Math.floor(L / 536870912));
    for (o = 0; o < m.length; o += 64) {
      for (i = 0; i < 64; i++) w[i] = i < 16 ? dv.getInt32(o + i * 4) : (w[i - 16] + (r(w[i - 15], 7) ^ r(w[i - 15], 18) ^ (w[i - 15] >>> 3)) + w[i - 7] + (r(w[i - 2], 17) ^ r(w[i - 2], 19) ^ (w[i - 2] >>> 10))) | 0;
      var a = H[0], bb = H[1], cc = H[2], d = H[3], e = H[4], f = H[5], g = H[6], h = H[7];
      for (i = 0; i < 64; i++) {
        var t1 = (h + (r(e, 6) ^ r(e, 11) ^ r(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + w[i]) | 0, t2 = ((r(a, 2) ^ r(a, 13) ^ r(a, 22)) + ((a & bb) ^ (a & cc) ^ (bb & cc))) | 0;
        h = g; g = f; f = e; e = (d + t1) | 0; d = cc; cc = bb; bb = a; a = (t1 + t2) | 0;
      }
      [a, bb, cc, d, e, f, g, h].forEach(function (v, k) { H[k] = (H[k] + v) | 0; });
    }
    return H.map(function (v) { return ('0000000' + (v >>> 0).toString(16)).slice(-8); }).join('');
  }
  function ok() { return sha256(pw.value.trim().toUpperCase()) === HASH; }
  function setLang(l) {         // the game's language switch drives these words too (it calls window.skyGate.setLang)
    lang = WORDS[l] ? l : 'en';
    $('gateh').textContent = WORDS[lang].h; $('gatego').textContent = WORDS[lang].go; pw.setAttribute('aria-label', WORDS[lang].h);
    msg.textContent = wrong ? WORDS[lang].wrong : '';
  }
  function open() { gate.hidden = true; document.documentElement.classList.remove('gated'); pw.blur(); try { localStorage.setItem(KEY, '1'); } catch (e) {} }
  try { if (localStorage.getItem(KEY) === '1') gate.hidden = true; } catch (e) {}
  if (!gate.hidden) document.documentElement.classList.add('gated');
  ['keydown', 'keyup', 'pointerdown', 'pointerup', 'mousedown', 'mouseup', 'wheel'].forEach(function (t) { gate.addEventListener(t, function (e) { e.stopPropagation(); }); });
  pw.addEventListener('input', function () { wrong = false; msg.textContent = ''; if (ok()) open(); });
  gate.querySelector('form').addEventListener('submit', function (e) { e.preventDefault(); if (ok()) open(); else { wrong = true; msg.textContent = WORDS[lang].wrong; pw.value = ''; pw.focus(); } });
  // the same first language as the game: ?lang=, then the switch remembered on this device, then Lithuanian (rule 21)
  var q = (new URLSearchParams(location.search).get('lang') || '').toLowerCase(), l = q === 'lt' || q === 'en' ? q : '';
  if (!l) { try { l = localStorage.getItem(LANG_KEY) || ''; } catch (e) {} }
  if (l !== 'lt' && l !== 'en') l = 'lt';
  setLang(l);
  ['lt', 'en'].forEach(function (k) {   // the switch works on the gate even before the game has loaded

      setLang(k); $('lang-lt').classList.toggle('on', k === 'lt'); $('lang-en').classList.toggle('on', k === 'en');
      try { localStorage.setItem(LANG_KEY, k); } catch (e) {}
      try { var u = new URL(location.href); u.searchParams.set('lang', k); history.replaceState(null, '', u); } catch (e) {}
    });
  });
  $('lang-lt').classList.toggle('on', l === 'lt'); $('lang-en').classList.toggle('on', l === 'en');
  window.skyGate = { setLang: setLang, sha256: sha256, hash: HASH, get passed() { return gate.hidden; } };
  if (!gate.hidden) pw.focus();
})();

function buildSky(t) {

    camera.rotation.set(look.pitch * rad, look.yaw * rad, 0); camera.updateMatrixWorld();

}

// ---------- entering VR ----------
const vrBtn = $('vrbtn');
const sayVr = t => showMsg(t);
if (IN_HEADSET) vrBtn.classList.add('ok', 'big');
if (navigator.xr && navigator.xr.isSessionSupported) {
  navigator.xr.isSessionSupported('immersive-vr').then(ok => { if (ok) vrBtn.classList.add('ok'); else if (IN_HEADSET) sayVr(W.vrNo); }).catch(() => {});
} else if (IN_HEADSET) sayVr(W.vrNoXr);
vrBtn.addEventListener('click', async () => {
  unlockAudio();
  const cur = renderer.xr.getSession();
  if (cur) { cur.end(); return; }
  try {
    const s = await navigator.xr.requestSession('immersive-vr', { optionalFeatures: ['local-floor', 'hand-tracking'] });
    await renderer.xr.setSession(s);
  } catch (e) { console.info('VR session not started:', e.message); sayVr(W.vrFail + e.message); }
});
renderer.xr.addEventListener('sessionstart', () => {

});

  sky.position.set(0, 0, 0); sky.rotation.set(0, 0, 0); camera.position.set(0, 0, 0);
  if (S.phase === 'naming') { $('namebox').classList.add('open'); $('nameinput').value = S.typed; }
  vrBtn.textContent = W.enterVr;
  idlePromptIfIdle(); resize();     // resize lays the boxes out again, and gives the Quest Browser its big Enter VR back if nothing else is open
});
function idlePromptIfIdle() { if (S.phase === 'idle') idlePrompt(); }

// ---------- loop ----------
let last = 0;
renderer.setAnimationLoop((t, frame) => {
  const dt = Math.max(0, Math.min(.1, (t - last) / 1000 || 0)); last = t;
  const xr = inXR();
  stepTurns(dt);
  if (xr) xrUpdate(frame, dt);
  else {
    if (look.keys.size) {
      const v = 40 * dt;
      if (look.keys.has('ArrowLeft')) look.yaw += v; if (look.keys.has('ArrowRight')) look.yaw -= v;
      if (look.keys.has('ArrowUp')) look.pitch = Math.min(89, look.pitch + v); if (look.keys.has('ArrowDown')) look.pitch = Math.max(-89, look.pitch - v);
    }
    camera.rotation.set(look.pitch * rad, look.yaw * rad, 0);
  }
  pumpUploads();
  holdStep();
  if (S.phase !== 'loading') tick(dt);
  for (const P of [kb, ctl, mini]) if (P.dirty && (xr || window.__skyForceDraw)) { P.draw(P); P.tex.needsUpdate = true; P.dirty = false; }
  stepTag();
  renderer.render(scene, camera);
});

// ---------- language: every word on screen, redrawn in place ----------
function applyLang() {
  document.documentElement.lang = LANG; document.title = W.title;
  const t = (id, v) => { const e = $(id); if (e) e.textContent = v; }, a = (id, v) => { const e = $(id); if (e) e.setAttribute('aria-label', v); };
  t('v1', W.v1); t('v2', W.v2); t('replay', W.replay); t('reset', S.armed ? W.sure : W.reset); t('sound', muted ? W.soundOff : W.soundOn);
  t('vrbtn', renderer.xr.isPresenting ? W.exitVr : W.enterVr); t('namego', W.ok); t('findgo', W.find);
  t('testtitle', W.testTitle); t('testall', W.testAll(cons.length, paintTotal())); t('testhalf', W.testHalf); t('testreset', W.testReset); t('testclose', W.testClose); t('testbadge', W.testBadge);
  document.querySelector('#namebox h2').textContent = W.ask;
  a('nameinput', W.nameAria); a('nameclose', W.close); a('findx', W.close); a('findopen', W.findPh); a('findinput', W.findPh); a('langseg', W.langAria); a('vseg', W.vAria);
  $('findinput').placeholder = W.findPh;
  if (S.phase === 'loading' && $('msg').textContent) showMsg(W.loading);
  $('lang-lt').classList.toggle('on', LANG === 'lt'); $('lang-en').classList.toggle('on', LANG === 'en');
  for (const b of CTL_MAIN) b.label = { V1: W.v1, V2: W.v2, REPLAY: W.replay, RESET: S.armed ? W.sure : W.reset, FIND: W.find, HIDE: W.hide, VIEW: W.resetView }[b.id] || b.label;
  for (const b of mini.btns) b.label = { SHOW: W.show }[b.id] || b.label;
  for (const b of kb.btns) b.label = { CLOSE: W.close, OK: W.ok }[b.id] || b.label;
  drawHideBtn();
  if (cons.length) { updateCount(); drawPrompt(); drawHint(); drawFindHint(); setSuggest(S.findSug); }
  if (label && label.visible && S.found) { const f = S.found, a0 = f.at, u = f.until; showFound(f.con, f.part); S.found.at = a0; S.found.until = u; look.turn = null; vr.turn = null; }
  if (tag.con) { drawTag(); stepTag(); }                   // the name and story on the sky, in the new language
  if (window.skyGate) window.skyGate.setLang(LANG);      // the beta gate's three words follow the switch too
  kb.dirty = ctl.dirty = mini.dirty = true;
  layoutUI();
}
function setLang(l) {
  if (!WORDS[l] || l === LANG) return;
  LANG = l;
  try { localStorage.setItem(LANG_KEY, l); } catch (e) { /* private window: the switch lasts this visit */ }
  try { const u = new URL(location.href); u.searchParams.set('lang', l); history.replaceState(null, '', u); } catch (e) { /* sandboxed page */ }
  applyLang();
}
applyLang();

// ---------- go ----------
setVersion(S.version);
try {
  await loadAll();
  showMsg(''); resize();
  S.phase = 'idle'; idlePrompt();
} catch (e) {
  console.error(e);
  showMsg(location.protocol === 'file:' ? W.needServer : W.notLoaded + e.message);
}

// ---------- test hooks (headless QA) ----------
const orionTan = () => {        // the old analytic frame of Orion, kept so the fit can be checked against the mesh
  const f = ORI.fig, m = f.uv2tan, a0 = f.tangent.ra0, d0 = f.tangent.dec0, C = dirOf(a0, d0), al = (a0 - RA_FRONT) * rad, dl = d0 * rad;
  const E = new THREE.Vector3(-Math.cos(al), 0, Math.sin(al)), N = new THREE.Vector3(Math.sin(dl) * Math.sin(al), Math.cos(dl), Math.sin(dl) * Math.cos(al));
  return { C, E, N,
    dir(x, y, out = new THREE.Vector3()) { return out.copy(C).addScaledVector(E, -x * rad).addScaledVector(N, y * rad).normalize(); },
    uv(u, v) { return [m[0][0] * u + m[0][1] * v + m[0][2], m[1][0] * u + m[1][1] * v + m[1][2]]; } };
};
window.__sky = {
  S, TIME, REVEAL, reveals: R, scene, nameOK, matchName, fold, GENITIVE, STORE, revealAt, renderer, camera, sky, dirOf, radec, stars, lineU, kb, ctl, vr, look, head, cons, byIau, figs, pick, texCache, hiKeep, MEM, ADULT,
  FIND, FIND_SHOWS_PAINTING, findMatch, partOf, norm, find: doFind, closeFind, pickFound, selectCon, canPick, countText, paintedCount, paintTotal, get label() { return label; }, FIND_WHOLE, FIND_PART, FIND_MULTI, ALIAS,
  setLang, get lang() { return LANG; }, WORDS, nm, LANG_KEY, get build() { return BUILD; },
  get testMode() { return S.test; }, get testOpen() { return S.testOpen; }, CTL_TEST,
  HOLD, hold, ring3, ASSET_BASE, asset, pickAt: (x, y) => { const c = pickScreen(x, y); return c ? c.iau : null; },     // hold Cygnus, the asset base
  // 2026-11-12: the colour wave, hiding the boxes, the layout, the name and story on the sky, turning the sky in VR
  WAVE, waveU, waveMesh, get wave() { return wave; }, startWave, stopWave,
  setCollapsed, get collapsed() { return S.collapsed; }, layoutUI, LAYOUT,
  tag, tagGroup, TAG, tagHit2D, tagRect2D, showTag, toggleStory, closeTag, storyOf, get STORIES() { return STORIES; }, stepTag,
  mini, separatePanels, yawOf, halfW, resetView, dragSky, turnSky, STEER,
  get orion() { return ORI.fig; }, get tan() { return orionTan(); }, inOrion: d => pick(d) === ORI,
  get artU() { return lastU; },     // the latest reveal
  get art() { const r = R[R.length - 1]; return S.phase === 'reveal' && r ? (r.slot ? r.slot.mesh : { visible: false }) : (S.last && S.last.fig && S.last.fig.mesh) || { visible: false }; },
  // screen px of a sky position on the flat view
  project(ra, dec) {
    const v = dirOf(ra, dec).multiplyScalar(SKY.R).applyQuaternion(sky.quaternion).add(sky.position);
    const inFront = v.clone().sub(camera.position).applyQuaternion(camera.quaternion.clone().invert()).z < 0;

  btnWorld(P, id) {
    const b = P.btns.find(b => b.id === id), x = ((b.x + b.w / 2) / P.pxW - .5) * P.W, y = (.5 - (b.y + b.h / 2) / P.pxH) * P.H;

    const [nu, nv] = S.last.fig.reveal.size, i = Math.round(u * nu), j = Math.round(v * nv), k = j * (nu + 1) + i, g = R[R.length - 1].slot.mesh.geometry, w = lastU.uW.value.toArray();
    const p = new THREE.Vector3().fromBufferAttribute(g.attributes.position, k);
