<title>Flight School Quiz</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;900&display=swap">
<style>
:root{color-scheme:dark;--bg:#1B1147;--bg2:#3B1E8C;--panel:#141B3E;--ink:#FFFFFF;--muted:#C9BEEA;--gold:#FFC24B;--cyan:#4FD8FF;
--c1:#1F6FD1;--c2:#D8352A;--c3:#1E9E52;--c4:#F2B81C;--font:"Rubik",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(ellipse at 20% 10%,var(--bg2),var(--bg) 70%);color:var(--ink);font-family:var(--font);padding-inline:16px;padding-block:16px}
.app{max-width:1200px;height:100%;margin:0 auto;display:grid;grid-template-rows:auto 1fr auto;gap:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:14px;color:var(--muted)}
.pill{background:var(--panel);border:1px solid #2F3A7A;border-radius:6px;padding:6px 10px;color:var(--cyan);font-variant-numeric:tabular-nums}
main{display:grid;align-content:center;gap:clamp(14px,3vh,28px);min-height:0}
h1{font-weight:900;font-size:clamp(28px,5vw,64px);line-height:1.08;margin:0;text-wrap:balance}
.q{font-weight:700;font-size:clamp(22px,3.6vw,46px);line-height:1.18;margin:0;text-wrap:balance}
.code{font-weight:700;font-size:clamp(18px,2.6vw,32px);background:#fff;color:#141B3E;border-radius:8px;padding:10px 18px;line-height:1.35;justify-self:start}
.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(10px,1.6vw,18px)}
.a{display:flex;align-items:center;gap:14px;border-radius:10px;padding:clamp(12px,2vh,22px) 18px;font:700 clamp(18px,2.5vw,32px)/1.2 var(--font);color:#fff;transition:opacity .25s,transform .25s}
.a .n{flex:none;width:1.7em;height:1.7em;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;font-weight:900}
.a1{background:var(--c1)}.a2{background:var(--c2)}.a3{background:var(--c3)}.a4{background:var(--c4);color:#141B3E}
.a4 .n{background:rgba(20,27,62,.15)}
.revealed .a:not(.ok){opacity:.22}
.revealed .a.ok{transform:scale(1.03);box-shadow:0 0 0 4px #fff}
.mentor{background:var(--panel);border-left:6px solid var(--gold);border-radius:8px;padding:14px 18px;font-size:clamp(16px,2vw,24px);line-height:1.4}
.mentor b{color:var(--gold);letter-spacing:.06em;text-transform:uppercase;font-size:.75em;display:block;margin-bottom:4px}
footer{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
.btns{display:flex;gap:10px;flex-wrap:wrap}
button.ctl{font:700 16px var(--font);border-radius:8px;border:2px solid var(--muted);background:transparent;color:#fff;padding:10px 16px;cursor:pointer}
button.ctl.primary{background:var(--gold);border-color:var(--gold);color:#141B3E}
button.ctl:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.hint{color:var(--muted);font-size:14px}
.start{display:grid;grid-template-columns:1.2fr 1fr;gap:24px;align-items:center}
.start img{width:100%;max-width:420px;border-radius:12px;background:#fff}
.start p{font-size:clamp(18px,2.2vw,26px);line-height:1.4;color:var(--muted);margin:0}
.fingers{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.fingers span{border-radius:8px;padding:8px 14px;font-weight:900;font-size:22px}
@media (max-width:700px){.answers{grid-template-columns:1fr}.start{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.a{transition:none}}
</style>
<div class="app">

  <main id="stage"></main>
  <footer>
    <span class="hint">Space = show answer · → next · ← back</span>
    <div class="btns"><button class="ctl" id="back">← Back</button><button class="ctl" id="show">Show answer</button><button class="ctl primary" id="next">Next →</button></div>
  </footer>
</div>

const Q = [
 {q: "What is pseudocode?", a: ["A secret robot language", "A plan for a program, written so people can read it", "A broken program", "A LEGO piece"], ok: 1, m: "Pseudocode is a plan for a program in human words. We write it BEFORE we code."},
 {q: "What can pseudocode use?", a: ["Only words", "Only numbers", "Only pictures", "Words, symbols AND pictures"], ok: 3, m: "There are no set rules. Our arrow cards were pseudocode too!"},
 {q: "The plane's plan says:", code: "1. Fly straight ahead<br>2. Turn left<br>3. Fly straight", qq: "What does the plane do FIRST?", a: ["It turns left", "It stops", "It flies straight ahead", "It turns right"], ok: 2, m: "Step 1 comes first. A computer does the steps in order, one at a time."},
 {q: "A list of steps that solves a problem is called…", a: ["An algorithm", "A sensor", "A motor", "A minifigure"], ok: 0, m: "ALGORITHM. The flight plan was an algorithm for rescuing Leo and Luna."},
 {q: "The plane crashed into a tree because the plan missed a step. A mistake in a program is called…", a: ["A brick", "A bug", "A pilot", "A map"], ok: 1, m: "A BUG. Finding and fixing bugs is called debugging. Every programmer does it."},
 {q: "Why do programmers write pseudocode first?", a: ["Because robots can read it", "To make the robot faster", "To plan and check the steps before coding", "Because code is boring"], ok: 2, m: "Pseudocode is quick to write, easy to change, and other people can read it."},
 {q: "Which plan matches these cards?", code: "▲ &nbsp; ▲ &nbsp; ↰ &nbsp; ▲", a: ["Forward, turn left, forward, forward", "Forward, forward, turn left, forward", "Turn left, forward, forward, forward", "Forward, forward, forward, turn left"], ok: 1, m: "Read the cards left to right, one at a time. Same as the Navigator does."},
 {q: "“Turn left, then fly straight” and “Fly straight, then turn left.” Does the plane end in the same place?", a: ["Yes, always", "No. The order changes where it goes", "Only if it is windy", "Only on Tuesdays"], ok: 1, m: "ORDER matters. Same steps, different order, different place."},
 {q: "Another crew flies YOUR plan and crashes. What is the best thing to do?", a: ["Blame them", "Throw the plan away", "Read the plan together and find the unclear step", "Never share plans again"], ok: 2, m: "A good plan works for other people too. If it doesn't, we fix the plan together."},
 {q: "Pseudocode is written so that…", a: ["Computers can run it straight away", "Other PEOPLE can read and understand it", "It stays secret", "It looks cool"], ok: 1, m: "Pseudocode is for humans. Code is for the robot."}
];
let i = -1, rev = false;
const st = document.getElementById('stage'), prog = document.getElementById('prog');
function card(h, p) { return '<div class="start"><div><h1>' + h + '</h1><p>' + p + '</p></div><img src="' + PLANE + '" alt="Rescue plane over the forest"></div>'; }
function render() {
  st.classList.remove('revealed'); rev = false;
  if (i < 0) {
    prog.textContent = 'Start';
    st.innerHTML = card('Flight School Quiz', '10 questions about plans, pseudocode and bugs. Answer with your fingers: 1, 2, 3 or 4.')
      .replace('</p></div>', '</p><div class="fingers"><span class="a1">1</span><span class="a2">2</span><span class="a3">3</span><span class="a4">4</span></div></div>');
    return;
  }
  if (i >= Q.length) { prog.textContent = 'Done'; st.innerHTML = card('Flight school complete!', 'You can read pseudocode, plan with it, and code from it. Leo and Luna say thank you.'); return; }
  const x = Q[i]; prog.textContent = (i + 1) + ' / ' + Q.length;
  st.innerHTML = '<p class="q">' + x.q + '</p>' + (x.code ? '<div class="code">' + x.code + '</div>' : '') + (x.qq ? '<p class="q">' + x.qq + '</p>' : '') +
    '<div class="answers">' + x.a.map((t, k) => '<div class="a a' + (k + 1) + (k === x.ok ? ' ok' : '') + '"><span class="n">' + (k + 1) + '</span><span>' + t + '</span></div>').join('') + '</div>' +
    '<div class="mentor" id="m" hidden><b>Mentor reads</b>' + x.m + '</div>';
}
function show() { if (i < 0 || i >= Q.length) return; rev = true; st.classList.add('revealed'); document.getElementById('m').hidden = false; }
function next() { if (i >= 0 && i < Q.length && !rev) { show(); return; } if (i < Q.length) { i++; render(); } }
function back() { if (i > -1) { i--; render(); } }
document.getElementById('next').onclick = next; document.getElementById('back').onclick = back; document.getElementById('show').onclick = show;
addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'PageDown') { next(); e.preventDefault(); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { back(); e.preventDefault(); }
  else if (e.key === ' ') { show(); e.preventDefault(); }
});
render();
</script>
